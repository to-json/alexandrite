[package]
name = "alx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "alx"
path = "src/main.rs"

[lib]
name = "alx"
path = "src/lib.rs"

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranelift-codegen = "0.136"
cranelift-frontend = "0.136"
cranelift-jit = "0.136"
cranelift-module = "0.136"
cranelift-native = "0.136"
libc = "0.2"

[build-dependencies]
cc = "1"
