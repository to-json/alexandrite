<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a compiler's engineering notebook. Sidebar of milestones on the left,
   one reading column (~68ch) on the right; stacks to a top strip on phones.
   Accent follows the alexandrite effect: green by daylight, raspberry by lamplight. */
:root {
  --bg: #f6f7f4;
  --panel: #eceee8;
  --fg: #1d2420;
  --muted: #5c6862;
  --rule: #d3d8d1;
  --accent: #1e7563;
  --accent-soft: #d6ebe4;
  --done: #1e7563;
  --code-bg: #e6e9e3;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --step--1: 0.84rem;
  --step-0: 1rem;
  --step-1: 1.22rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131a; --panel: #1f1a23; --fg: #ece5ea; --muted: #a596a2; --rule: #3a3140;
    --accent: #e4678a; --accent-soft: #3d2230; --done: #e4678a; --code-bg: #241e29;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131a; --panel: #1f1a23; --fg: #ece5ea; --muted: #a596a2; --rule: #3a3140;
  --accent: #e4678a; --accent-soft: #3d2230; --done: #e4678a; --code-bg: #241e29;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 var(--step-0)/1.65 var(--font-body); }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.shell { display: grid; grid-template-columns: 17rem minmax(0, 1fr); min-height: 100%; }
nav.side {
  background: var(--panel); border-right: 1px solid var(--rule);
  padding-block: 1.6rem; padding-inline: 1.2rem;
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 1.4rem;
}
.brand { font: 700 var(--step-1)/1.1 var(--font-display); letter-spacing: -0.01em; }
.brand small { display: block; font: 500 var(--step--1)/1.3 var(--font-mono); color: var(--muted); letter-spacing: 0; margin-top: 0.35rem; }
.navgroup { display: flex; flex-direction: column; gap: 0.15rem; }
.navgroup h2 { font: 600 0.7rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 0 0.45rem; }
.navlink {
  display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); align-items: baseline; gap: 0.35rem;
  padding: 0.32rem 0.5rem; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 0.93rem; line-height: 1.35;
}
.navlink .tag { font: 600 0.72rem/1 var(--font-mono); color: var(--muted); }
.navlink.current { background: var(--accent-soft); }
.navlink.current .tag { color: var(--accent); }
.navlink.planned { color: var(--muted); }
.navlink:hover { background: var(--accent-soft); }

main { padding-block: 2.4rem 4rem; padding-inline: clamp(1rem, 4vw, 3.5rem); min-width: 0; }
article { max-width: 68ch; }
article h1 { font: 700 var(--step-3)/1.1 var(--font-display); letter-spacing: -0.02em; margin: 0 0 1.2rem; text-wrap: balance; }
article h2 { font: 700 var(--step-2)/1.2 var(--font-display); letter-spacing: -0.01em; margin: 2.4rem 0 0.8rem; text-wrap: balance; }
article h3 { font: 600 var(--step-1)/1.3 var(--font-display); margin: 1.8rem 0 0.6rem; }
article p, article li { margin: 0 0 0.9rem; }
article ul, article ol { padding-left: 1.3rem; margin: 0 0 1rem; }
article code { font: 400 0.86em/1.4 var(--font-mono); background: var(--code-bg); padding: 0.08em 0.32em; border-radius: 4px; }
article pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 0.9rem 1rem; overflow-x: auto; margin: 0 0 1.2rem; }
article pre code { background: none; padding: 0; font-size: 0.84rem; line-height: 1.55; }
.tablewrap { overflow-x: auto; margin: 0 0 1.4rem; border: 1px solid var(--rule); border-radius: 8px; }
article table { border-collapse: collapse; width: 100%; font-size: 0.88rem; line-height: 1.45; font-variant-numeric: tabular-nums; }
article th { font: 600 0.74rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); text-align: left; background: var(--panel); }
article th, article td { padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
article tr:last-child td { border-bottom: 0; }
article blockquote { margin: 0 0 1rem; padding-left: 1rem; border-left: 3px solid var(--accent); color: var(--muted); }

.progress { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.2rem, 1fr)); gap: 0.5rem; margin: 0 0 2rem; max-width: 68ch; }
.step { border: 1px solid var(--rule); border-radius: 8px; padding: 0.6rem 0.7rem; text-decoration: none; color: var(--fg); display: flex; flex-direction: column; gap: 0.2rem; }
.step .n { font: 600 0.72rem/1 var(--font-mono); color: var(--muted); display: flex; justify-content: space-between; }
.step .t { font: 600 0.92rem/1.25 var(--font-display); }
.step.done { border-color: var(--done); background: var(--accent-soft); }
.step.done .n { color: var(--done); }
.step:hover { border-color: var(--accent); }
.meta { font: 400 var(--step--1)/1.4 var(--font-mono); color: var(--muted); margin: -0.6rem 0 1.6rem; }

@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding-block: 1rem; padding-inline: 1rem; gap: 0.9rem; }
  .navgroup { flex-direction: row; flex-wrap: wrap; gap: 0.3rem; }
  .navgroup h2 { width: 100%; margin-bottom: 0.2rem; }
  .navlink { grid-template-columns: auto; padding: 0.3rem 0.55rem; border: 1px solid var(--rule); }
  .navlink .name { display: none; }
  .navgroup.plan .navlink .name { display: inline; }
  main { padding-block: 1.6rem 3rem; padding-inline: 1rem; }
}
@media (prefers-reduced-motion: no-preference) { .step, .navlink { transition: background 0.15s, border-color 0.15s; } }
</style>

<script>
const DATA = {"docs": [{"id": "roadmap", "title": "Roadmap", "group": "plan", "md": "# Roadmap: Go parity, errors, refinements\n\nGoal of this push (user, 2026-10-01): **finish the language** to Go parity, plus DESIGN.md's error system and refinements, so the next step can be porting Go's standard library. The memory model (pools, the move/region checker) is a separate conversation *after* this push; until then everything lives in v0's program-lifetime region.\n\nEvery decision these milestones implement is in `GO-VS-RUBY.md`. Each milestone ends with: acceptance cases (`acceptance/cases/`), all backends agreeing (JIT, clang debug/release, Rust oracle; the browser where the feature makes sense there), `run.py` green, a milestone doc in `docs/milestones/`, a commit, and an update to the doc site.\n\n| # | Milestone | Contents |\n|---|---|---|\n| M1 | **Numbers** | `I8..I64`, `U8..U64`, `Byte`, `Rune` (Int = I64); hex/octal/binary literals; bitwise `& \\| ^ << >> &^` and unary `^`; wrapping `+% -% *%`; explicit conversions (`x.to_u32`); per-type overflow checks; Go's exact constants and top-level `const` (visible inside defs) |\n| M2 | **Everyday syntax** | `for x in xs`; `case x { pat => v }` (values, ranges, `_`); `\"#{x}\"` interpolation; block-scoped `defer`; `fn` / `\u0192` = `#[pure] def`; `else if` |\n| M3 | **Collections and absence** | C1: `[T]` slices (shared storage, `a[lo...hi]`, append, `copy`), `[T; N]` fixed arrays; Str as bytes (`s[i]` is a Byte, `bytes`, `runes`); ordered `Map[K, V]` with literals; `T?` with narrowing (`if x = e`), `\\|\\|`, `?.`, `none`; lookups, `find`, `first`, `max` return `T?` |\n| M4 | **Types** | methods inside structs (`def m!` mutates); `enum` with payloads and exhaustive `case`; structural `interface`s with default methods; operator overloading through interfaces; explicit generics `[T]` on defs and structs (`like Int` bounds); escaping lambdas `->(x) { }` |\n| M5 | **Errors** | `error` declarations; `~T`, `~T<E>`, `~T<Error>`; `~` propagation (replaces `try`); inferred closed sets; Results as values; `rescue`, `fail`, `case` over errors, `wrap`/`cause`; printing |\n| M6 | **Packages and refinements** | directory packages, `import \"path\"`, `pub`; `alx.mod`; `refine` / `using`, lexically scoped |\n| M7 | **Concurrency** | `spawn`, `Chan[T]`, `select`, waiting, `Context`; a panic kills its task, not the process |\n| M8 | **Tooling** | `alx fmt`; `alx test` (`*_test.alx`, `test`, `bench`, output-checked examples); unused warnings and `--strict` |\n\nOrder is by dependency: numbers and syntax first (small, everything uses them), then collections (C1 changes array semantics under everything), then types, errors (which use enums and interfaces), packages, concurrency (which uses all of it) and tooling.\n"}, {"id": "decisions", "title": "Go vs Ruby decisions", "group": "plan", "md": "# Go vs Ruby: decision log\n\nAlexandrite's **capabilities and use case follow Go** (a GC-less Go: services, tools, systems code), and Go's standard library will be ported later, minus the parts that only exist for Go's GC. **Ruby is a source of syntax and ergonomics**, not semantics. This file lists every place the two disagree that we can see coming, so each is decided once, deliberately, before code depends on it.\n\nStatus: **decided** (with who/when), **open** (recommendation given), or **current** (what v0 does today, not yet confirmed). Recommendations lean Go wherever the stdlib port depends on it.\n\n## Numbers\n\n| # | Question | Go | Ruby | Alexandrite now | Recommendation | Status |\n|---|---|---|---|---|---|---|\n| N1 | How `puts`/`to_s` print a Float | `fmt.Println`: `100`, `1e+06`, `+Inf` | `100.0`, `1.0e+16`, `Infinity` | Go | Go | **decided** (user, 2026-10-01) |\n| N2 | `sum` of Floats | plain loop | Kahan\u2013Babu\u0161ka compensated | plain | Go | **decided** (Go reference) |\n| N3 | `format` / printf verbs | `%v %d %s %t %f %.Nf %e %g %x %q`, widths, flags; `%s` only for strings | Kernel#format (C-like; `%s` takes anything) | Go subset: `%v %d %s %t %f %.Nf` | Go verbs; grow with the `fmt` port | **decided** (Go reference) |\n| N4 | Int and Float in one expression (`1 + x` where `x` is Float) | compile error unless the Int is an untyped constant; variables need `float64(i)` | implicit conversion | implicit (Ruby) | Go: literals adapt, Int *variables* need `.to_f` (an i64 above 2^53 silently loses precision) | **decided: Go** (user, 2026-10-01) |\n| N5 | Constant arithmetic | exact, arbitrary precision at compile time (`0.1 + 0.2 == 0.3`; `-0.0` is `+0`) | ordinary runtime floats | runtime floats | keep runtime semantics for v0; revisit with the constant system | **decided: Go's exact constants** (user, 2026-10-01) |\n| N6 | Integer `/` and `%` with negatives | truncate: `-7 / 2 == -3`, `-7 % 2 == -1` | floor: `-4`, `1` | floor (Ruby) | Go: ported code (hashing, encoding, time) assumes truncation | **decided: Go, truncate** (user, 2026-10-01) |\n| N7 | Integer types | `int8..int64`, `uint8..uint64`, `uintptr`, `int` = 64-bit, `byte`, `rune` | one `Integer` (bignum on demand) | `Int` = i64; bignums via `#![overflow(promote)]` | add Go's sized and unsigned types; `Int` stays the default | **decided: Go's full set**: I8..I64, U8..U64, Int = I64, Byte = U8, Rune = I32; literals adapt, sized types convert explicitly (user, 2026-10-01) |\n| N8 | Integer overflow | wraps silently | promotes to bignum | panics (or `try`); directives for `wrap` / `promote` | keep panic as default; add explicit wrapping operators (e.g. `+%`, as in Zig) so crypto/hash ports don't need a file-wide `#![overflow(wrap)]` | **decided: panic by default; wrapping operators `+%` `-%` `*%`** (plus `#![overflow(wrap)]` per file) (user, 2026-10-01) |\n| N9 | Float \u2192 Int | truncates; NaN or out of range is implementation-defined | `FloatDomainError`, or a bignum | truncates; panics on NaN, \u00b1Inf and out of range | keep the panic (safety over Go's silence) | current |\n| N10 | `**` power operator | none (`math.Pow`) | `**` | `**` on Int | keep `**`; add `math.pow` with the stdlib | current |\n\n## Strings and text\n\n| # | Question | Go | Ruby | Alexandrite now | Recommendation | Status |\n|---|---|---|---|---|---|---|\n| S1 | `s.size` | bytes (`len(s)`) | characters | bytes | Go; characters via `s.chars.size` / a rune count | current |\n| S2 | Mutability | immutable `string`; build with `strings.Builder` / `[]byte` | mutable `String`, `<<` | immutable | Go | current |\n| S3 | `byte` and `rune` types | yes | no (Integers) | no | add `Byte` and `Rune` (needed for the stdlib) | **decided: Go model**: `s[i]` is a Byte, `s.bytes`, `s.runes`, `s.size` in bytes (user, 2026-10-01) |\n| S4 | String interpolation `\"#{x}\"` | none (`fmt.Sprintf`) | yes | no | add it: pure syntax, lowers to `format` with `%v` | **decided: add `\"#{x}\"`**, lowering to `%v` formatting (user, 2026-10-01) |\n| S5 | Symbols `:name` | none | yes | only `&:sym` block shorthand | keep it to that | current |\n| S6 | Invalid UTF-8 | strings are arbitrary bytes | encoding errors | arbitrary bytes | Go | current |\n\n## Collections\n\n| # | Question | Go | Ruby | Alexandrite now | Recommendation | Status |\n|---|---|---|---|---|---|---|\n| C1 | Array semantics | arrays are values; **slices are views sharing a backing array**; APIs mutate through slices (`sort`, `copy`, `io.Reader.Read(p []byte)`) | references to one growable array | growable arrays with **value semantics** (copied on assign and on pass) | Go's split: owned growable `Array` plus a borrowed slice view (`a[lo...hi]`) that functions can mutate through; pools make view lifetimes checkable. Biggest decision here: it shapes every stdlib signature | **decided: both, as in Go** (user, 2026-10-01): fixed-size value arrays *and* slices, designed to make sense together. Design to be written up and approved before implementation |\n| C2 | Hash / map | `map`, unordered (randomized iteration) | `Hash`, insertion-ordered | none yet (DESIGN.md says insertion-ordered) | insertion-ordered (deterministic output; no Go code depends on the randomness); name it `Map` or `Hash` | **decided: insertion-ordered `Map[K, V]`**, literal `{k => v}` (user, 2026-10-01) |\n| C3 | nil vs zero values | zero values for every type; `nil` for pointers/slices/maps/interfaces | `nil` everywhere | zero values internally; `T?` planned | Go zero values; `T?` instead of nil pointers | **decided: no nil anywhere; Go zero values + `T?`** (checked narrowing, `||`, `?.`, `none`) (user, 2026-10-01) |\n| C4 | Struct construction | `Body{X: 1, Mass: m}`, omitted fields zero | `Struct.new(1, 2)` or keywords | `Body.new(positional...)` | `Body.new(x: 1.0, mass: m)` with omitted fields zero (Go semantics, Ruby keyword look); positional allowed too | **decided: keywords + zero values, positional also allowed** (user, 2026-10-01) |\n| C5 | Struct semantics | values (copied) | references | values | Go | current |\n\n## Functions, methods, errors\n\n| # | Question | Go | Ruby | Alexandrite now | Recommendation | Status |\n|---|---|---|---|---|---|---|\n| F1 | Methods on structs | receivers declared outside the type; value vs pointer receivers | `def` inside the class; everything a reference | none | methods inside `struct Name { ... }`; a mutating method marked like Ruby's `!` (`def move!`) = Go pointer receiver | **decided: methods inside `struct { }`; `def name!` may mutate self (pointer receiver), plain `def` gets a copy** (user, 2026-10-01) |\n| F2 | Polymorphism | structural interfaces, satisfied implicitly | duck typing | none (DESIGN.md: traits, inferred `dyn`) | Go-style structural interfaces (`io.Reader` ports directly) | **decided: structural interfaces with default methods** (user, 2026-10-01) |\n| F3 | Errors | `error` values (interface), `(T, error)` returns, wrapping (`%w`, `errors.Is/As`) | exceptions | `T!` + `try`; one global `Err` | keep `T!`/`try` syntax; make the error type Go-like (interface, wrapping) so `(T, error)` ports to `T!` | **decided: Rust-shaped, layered** (user, 2026-10-01): closed inferred sets inside packages, every error implements `Error` (message, cause), open `~T<Error>` at boundaries; Results are values (`map`, `ok`, `err`, `unwrap_or`, `unwrap`); io/bufio follow Rust's std shape (EOF = `0`/`none`, `write_all`, `read_exact`). Spelling: see E1\u2013E4 |\n| F4 | Multiple return values | yes | arrays + destructuring | tuples + multi-assign | tuples are Go's multiple returns | current |\n| F5 | Cleanup | `defer` | `ensure`, blocks | none | `defer` | **decided: `defer`, block-scoped** (user, 2026-10-01) |\n| F6 | Panics | `panic` / `recover` (net/http recovers per request) | `raise` / `rescue` | abort the process | abort for now; per-task panic isolation later, so one bad request can't kill a server | **decided: a panic kills its task, not the process**; main still aborts; no general `recover` (user, 2026-10-01) |\n| F7 | Closures | func literals capture by reference | blocks | non-escaping blocks, inlined; explicit lambdas escape | keep | current |\n\n## Concurrency\n\n| # | Question | Go | Ruby | Alexandrite now | Recommendation | Status |\n|---|---|---|---|---|---|---|\n| K1 | Model | goroutines, channels, `select`, `sync`, `context` | threads, fibers, Ractors | `pmap`; DESIGN.md plans CSP (`spawn`, `concurrently`) with async inferred | Go's model and names (channels, `select`, `WaitGroup`, `context`), with DESIGN.md's inferred async | **decided: Go's model, Ruby-ish spelling**: `spawn {}`, `Chan[T]`, `ch << v`, `ch.recv`, `select { when ... }`, `Context` (user, 2026-10-01) |\n\n## Program structure and tooling\n\n| # | Question | Go | Ruby | Alexandrite now | Recommendation | Status |\n|---|---|---|---|---|---|---|\n| P1 | Packages | directory = package, `import \"path\"`, exported = Capitalized | `require` files, modules | `require \"file\"` | Go's directory packages and import paths; export with an explicit `pub` (Capitalized already means a type) | **decided: directory packages, `import \"path\"`, export with `pub`** (`require` goes away) (user, 2026-10-01) |\n| P2 | Naming of ported APIs | `strings.HasPrefix` | `start_with?` | snake_case | transliterate Go names to snake_case (`strings.has_prefix`); `?` on predicates | **decided: snake_case transliteration**, `?` on predicates, method sugar where natural (user, 2026-10-01) |\n| P3 | Unused variables / imports | compile errors | warnings at most | silent | warnings | **decided: warnings; errors under `--strict` and in `alx test`**; `_` silences (user, 2026-10-01) |\n| P4 | Formatter | `gofmt` (one style, no options) | rubocop (configurable) | none | `alx fmt`, gofmt-style | **decided: `alx fmt`, no options** (user, 2026-10-01) |\n| P5 | Tests | `go test`, `_test.go`, table tests, benchmarks | minitest / rspec | acceptance harness only | `alx test`, `_test.alx`, `go test` conventions including benchmarks | **decided: Go's conventions**: `alx test`, `*_test.alx`, `test \"name\" {}`, `bench`, output-checked examples (user, 2026-10-01) |\n| P6 | Dependencies | `go.mod`, minimal version selection, module proxy | gems, bundler | none | Go's module model | **decided: Go's module model**: `alx.mod`, URL imports, MVS, `alx.sum` (user, 2026-10-01) |\n| P7 | Truthiness | only `bool` | `nil`/`false` falsy | only `Bool` | Go | current |\n\n## Taste (not Go-vs-Ruby, but likely points of disagreement)\n\n| # | Question | Decision |\n|---|---|---|\n| T1 | Function keyword | `def`; **`fn` and `\u0192` mean `#[pure] def`** (user, 2026-10-01) |\n| T2 | Return values | implicit last expression; `return` for early exits (user, 2026-10-01) |\n| T3 | Parameter types | untyped = generic with an inferred bound inside a package; `pub` functions spell their types (user, 2026-10-01) |\n| T4 | Operator overloading | through standard interfaces only: `==`, `<=>`, `+ - * /`, `[]`; no custom operator symbols (user, 2026-10-01) |\n| T5 | Sum types | `enum` with payloads, exhaustive matching; payload-free enums cover Go's iota (user, 2026-10-01) |\n| T6 | Matching | `case x { pattern => value }`, an expression; values, ranges, enum patterns, `_` (user, 2026-10-01) |\n| T7 | Loops | add `for x in xs { }` (statement; `break`/`next`/`return` as in Go's for-range) alongside Enumerable (user, 2026-10-01) |\n| T8 | Arrays | C1: `[T]` is a Go slice (shared storage, reslicing, append); `[T; N]` a fixed-size value array whose slices view its storage (user, 2026-10-01) |\n\n## Errors and optionals: spelling (user, 2026-10-01)\n\nThe logic: **fallibility is a prefix** (\"approximately do this\", \"you'll probably get this\"), **optionality is a suffix** (it matches `?` on Bool methods). `!` means only \"mutates\".\n\n| # | Form | Meaning |\n|---|---|---|\n| E1 | `~T` / `~T<ParseError>` / `~T<ParseError \\| IoError>` / `~T<Error>` | fallible T: inferred set / declared set / union / open (any error). `< >` is reserved for error sets; generics use `[ ]` (Go, RBS) |\n| E2 | `T?` | optional T (no nil anywhere). `~T?<E>` = may fail, else maybe a T; `~T<E>?` = maybe a fallible T. `~` takes the type to its right including its `?` |\n| E3 | `~f(x)`, `x.~m(y)`, `~(a * b)`, `~r` | propagate: the `~` attaches to the call whose name follows it (not the whole chain), or to a parenthesized expression or a held Result. A fallible call in a chain without its own `~` is an error that says where to put it |\n| E4 | no `~` | you hold the Result value (`~T`); unused Results warn |\n| E5 | Go's `~int` approximation constraint | spelled `like Int` in generic bounds, so `~` keeps one meaning |\n| E6 | `rescue { \\|e\\| ... }`, `case e { Variant(x) => ... }`, `fail E`, `e.wrap(\"ctx\")` | handling, exhaustive over closed sets, `_` required on open ones |\n\n## Derived decisions (made while building; flagged for review)\n\n| # | Question | Decision | Milestone |\n|---|---|---|---|\n| D1 | Operator precedence | Ruby's order with Go's operators slotted in (`\\| ^` < `& &^` < `<< >>` < `+ -` < `* / %`); the Go port parenthesizes where Go's order differs | M1 |\n| D2 | Shifts | Go: no overflow panic, count >= width gives 0 (or -1), negative count panics | M1 |\n| D3 | Conversions | `to_X` checked (panics), `as_X` truncates like Go's `X(v)` | M1 |\n| D4 | Constants | Ruby spelling (`NAME = expr` at the top level, capitalized), Go's exact semantics | M1 |\n| D5 | Empty collections | `max`/`min`/`first`/`reduce` panic on empty (Go's `slices.Max`); lookups that commonly miss return `T?`: `find`, `m[k]`, `m.delete(k)` | M3 |\n| D6 | Subslice capacity | `a[lo..hi]` shares storage but has no spare capacity, so `<<` onto a subslice copies instead of overwriting the parent's next element (Go's `append` aliasing footgun); `a[lo..hi]` is inclusive, `a[lo...hi]` exclusive (Ruby ranges), either end may be left out | M3 |\n| D7 | `[v; n]` fill | a fill holding storage (a slice, a fixed array, a struct with one) is evaluated once per element, so `[[0; 3]; 3]` is three independent rows (Rust's `vec![v; n]` clones; Go's `make` gives nil rows) | M3 |\n| D8 | Map printing and keys | `puts m` prints Go's `map[k:v ...]` in insertion order (Go sorts); keys are integer types, Str or Bool for now; `m[k] op= v` reads a missing key as V's zero (Go) | M3 |\n| D9 | `copy(dst, src)` | Go's: copies `min(len)` elements, returns the count, overlapping slices behave like memmove | M3 |\n| D10 | Fields inside methods | read bare (`x`, Ruby's attribute style); writes spell `self.x = ...` and only a `!` method may write. Assigning to a bare field name is an error rather than a new local, so it can't silently shadow | M4 |\n| D11 | Receivers | a `!` method needs a variable (or field/element path) as its receiver, Go's addressability rule; a plain method gets a copy and assigning to `self` in one is an error pointing at `!` | M4 |\n| D12 | Interface values | a closed sum over the program's implementors (whole-program compile), so no boxing or GC; a struct/enum converts implicitly where the interface is wanted; interface methods can't be `!` yet | M4 |\n| D13 | Equality and ordering | structs, tuples and enums compare field by field (Go's comparable types); slice/map fields aren't comparable unless the type defines `def ==`; `def <=>` gives `< <= > >=` | M4 |\n| D14 | Printing | Go's `%v`: slices `[1 2]`, structs `{1 2}`, maps `map[k:v]`; enums print as `Circle(1)` / `Red`; a type's `to_s` is used everywhere it's printed, nested too (Go's `Stringer`) | M4 |\n| D15 | Generic instances | written `Stack[Int]`; type arguments inferred from constructor values or the declared type, else spelled `Stack[Int].new`; bounds `T: Shape` and `T: like Int` are checked per instance | M4 |\n| D16 | Lambdas | `->(x: T) -> R { }`, type `(T) -> R`, called `f(x)` or `f.call(x)`; captures are **copies** for now (slices and maps still share), revisited with the memory model; `return` returns from the lambda | M4 |\n| D17 | Error representation | `error` types are enums; an `Error` value is one sum over the program's error types (closed world, no boxing), carrying the location where it was raised and any `wrap` context. No stack traces | M5 |\n| D18 | Builtin errors | `IoError { NotFound(path), Failed(path) }`, `ArithError { Overflow, DivZero }` (from `~(arith)`), `Failure { Msg(message) }` (from `fail \"text\"`, Go's `errors.New`) | M5 |\n| D19 | Messages | an error's message is the value printed (`Missing(port)`) unless its type defines `def message`; `wrap(\"ctx\")` prefixes `ctx: `; uncaught at the top level: `error: <message> (<file:line:col>)`, exit 1 | M5 |\n| D20 | Error sets | `~T` infers the set; `~T<A \\| B>` is checked against what the body can fail with; `~T<Error>` is open. `case` over an Error matches variants unqualified (or a type name) and needs `_` for now | M5 |\n| D21 | Results without `~` | a fallible call without `~` is a `~T` value, also at the top level (no implicit exit); `~r` on a held value propagates; `ok`, `err`, `ok?`, `err?`, `unwrap`, `unwrap_or`, `rescue { \\|e\\| }`. A `pmap` block using `~` propagates the first failing element's error after all workers finish | M5 |\n| D22 | Package names | a package's declarations are qualified by its import path; a file reaches them as `alias.name` (alias = the path's last segment, or `import alias \"path\"`). Only `pub` declarations cross packages, methods included (`pub def` inside a struct); fields of a public type are visible (no field-level `pub` yet). `pub def` parameters must be typed | M6 |\n| D23 | Separate compilation | a package compiles separately (cached object + header) only when it's plain: no imports, interfaces, error or generic types, and its exports are typed, non-generic, non-fallible defs; anything else is checked with the program (interfaces, errors and lambdas have whole-program layouts) | M6 |\n| D24 | Refinements | `refine Name for Type { def ... }`; `using Name` applies to the rest of the enclosing block (the rest of the file at the top level, including defs below it); an active refinement wins over the type's own methods (Ruby); `pub refine` exports it | M6 |\n| D25 | Modules | `alx.mod`: `module`, `require`, `replace`, Go's minimal version selection over dependencies' alx.mod files; modules come from `replace` directories or the module cache (`$ALX_MODCACHE`, else `~/.alx/mod`). No downloading and no `alx.sum` yet | M6 |\n| D26 | Tasks | `spawn { }` / `spawn f(x)` runs on an OS thread for now (no M:N scheduler yet); the body gets copies of the locals it uses (slices, maps and channels share). `t.wait` is a `~T`: the body's own errors, or a `TaskError` if it panicked. When main ends the program ends, running tasks included (Go) | M7 |\n| D27 | Channels | `Chan[T].new(cap)` (no capacity: unbuffered, a rendezvous); `send`/`<<`, `recv` (a `T?`, none once closed and drained), `close`, `size`, `for v in ch`. Sending on or closing a closed channel panics (Go). `select { when v = ch.recv => ...; when ch.send(x) => ...; else => ... }` picks fairly among ready cases. A program where every task is blocked panics: \"all tasks are asleep: deadlock\" | M7 |\n| D28 | Concurrency in the browser | refused at compile time (the playground has no threads) | M7 |\n"}, {"id": "m0", "title": "M0: Where things stood", "group": "log", "md": "# M0: Where things stood\n\nBefore the Go-parity push (2026-10-01), Alexandrite was a working v0 compiler built to pass the Project Euler acceptance suite (ACCEPTANCE.md A1\u2013A7).\n\n## What exists\n\n- **Front end:** lexer, parser (braces-only, Ruby-flavored), checker with per-instance type inference and monomorphization, purity checking, and a small prover that removes overflow and index checks it can prove unnecessary.\n- **Backends, all from one low-level IR:**\n  - C via clang, for release builds (`alx build --release`); within about 1x of hand-written Rust on the benchmarks.\n  - A Cranelift JIT behind `alx run`: about 2 ms from edit to answer on small programs.\n  - A Rust \"oracle\" backend, compiled by rustc in CI to cross-check every program.\n  - WebAssembly, compiled in the browser: the playground on the website.\n- **Language:** Int (64-bit, overflow panics; `promote` and `wrap` modes), Float, Bool, Str, arrays, tuples, value structs with keyword construction, ranges, Enumerable chains fused into single loops, generators (`Enumerator.new`), `pmap`, `try` on fallible calls, `format` with Go's verbs, `require`d libraries.\n\n## Benchmarks at this point\n\n| program | alx release | Go | Rust | edit-to-answer: `alx run` vs `go run` |\n|---|---|---|---|---|\n| n-body, 1M steps | 30.1 ms | 34.8 ms | 31.6 ms | 69 ms vs 229 ms |\n| Project Euler (12 problems) | 1.1\u20131.4x faster than prebuilt Go, mostly startup; even with hand-optimized Go on the work itself | | | 7.5\u201392x faster |\n\n## What changed in direction\n\nGo became the reference for capabilities and semantics, Ruby the reference for syntax feel. Every divergence between them was decided up front with the user (GO-VS-RUBY.md). The rest of this site follows the milestones in the roadmap.\n"}, {"id": "m1", "title": "M1: Numbers", "group": "log", "md": "# M1: Numbers\n\nGo's integer types, exact constants and bit operations, on every backend: the JIT behind `alx run`, clang debug and release, the Rust oracle, and the browser. The test program `acceptance/cases/ints.alx` is a line-for-line port of a Go program, and all five backends print exactly what Go prints.\n\n## What you can write now\n\n```ruby\nBIG = 1 << 100                # constants are exact: no overflow until used\nSHIFTED = BIG >> 98           # 4\nKB: U32 = 1024                # a typed constant\nputs 0.1 + 0.2                # 0.3: folded exactly, as in Go\n\na: U8 = 200\nputs a +% 56                  # 0: wrapping arithmetic\nputs a + 56                   # panics: overflow (U8) at file:line:col\nputs ^a                       # 55: complement\nx = 0xff_ff\nputs x & 0x0f0f, x &^ 0xff    # bit operations, Go's and-not\nputs 1 << n                   # 0 once n >= 64, as in Go\n\nu: U64 = 18_446_744_073_709_551_615\nputs u / 3                    # unsigned division, comparison, printing\nputs 300.as_u8                # 44: truncates, like Go's uint8(300)\nputs 300.to_u8                # panics: the value doesn't fit U8\nputs format(\"%x %o %b %c\", 255, 8, 5, 9731)   # ff 10 101 \u2603\n\nstruct Pix { r: U8, g: U8, b: U8, a: U8 }     # 4 bytes in memory\nh: U32 = 2166136261           # FNV-1a: wrapping multiply where it's meant\n\"go\".bytes.each { h = (h ^ it.as_u32) *% 16777619 }\n```\n\n## What was built\n\n- **Types:** `I8 I16 I32 I64 U8 U16 U32 U64`, with `Int` = I64, `Byte` = U8 and `Rune` = I32. In registers every integer is a 64-bit value (sign- or zero-extended); in arrays and structs each takes its own width, so `[U8]` is a byte buffer.\n- **Literals:** `0x`, `0o`, `0b`, underscores, and integers of any size as constants.\n- **Constants (Go's rules):** literals and `NAME = expr` definitions are exact (big integers, exact rationals) and take a type only where they're used; one that doesn't fit is a compile error at that point. Typed constants (`KB: U32 = 1024`) behave like values of their type.\n- **Operators:** `& | ^ &^ << >>`, unary `^`, wrapping `+% -% *%`, and compound forms (`&=`, `<<=`, `+%=`, ...).\n- **Overflow:** checked per type; a panic names the type and the source position; under `try` it becomes an error.\n- **Conversions:** `x.to_u8` (checked), `x.as_u8` (truncates); Float \u2192 integer via `to_*`; `to_f` from any integer (unsigned for U64).\n- **Formatting:** `%d` for any integer, `%x %X %o %b %c`.\n- **Typed locals:** `x: U8 = 200`.\n\nThe lowering expands Go's semantics into a handful of primitive operations (bitwise ops, unsigned compare and divide, a narrow-width wrap), so each backend only had to implement those.\n\n## Calls I made (flagged for your review)\n\n| # | Question | What I did | Why |\n|---|---|---|---|\n| D1 | Operator precedence | **Ruby's order**, with Go's extra operators slotted in: `\\| ^` < `& &^` < `<< >>` < `+ -` < `* / %` | keeps `arr << x + 1` meaning \"push x + 1\". Go's order differs mainly for `a + b << 1`; the stdlib port will add parentheses there |\n| D2 | Shifts | **Go's semantics**: no overflow panic; shifting by the width or more gives 0 (or -1 for negative values shifted right); a negative count panics | Go code relies on bits falling off the end |\n| D3 | Conversions | `to_u8` checks (panics if the value doesn't fit), `as_u8` truncates like Go's `uint8(x)` | matches the \"panic by default, wrap when asked\" overflow decision |\n| D4 | Constant names | Ruby spelling: a capitalized name at the top level (`PI = 3.14159`), no `const` keyword | Ruby's syntax, Go's semantics |\n\n## Tests\n\n- `ints.alx`: 39 lines, identical to Go's output on all five backends.\n- Three failure cases: a runtime overflow (abort, message names `U8` and the line), a constant that doesn't fit (`constant 300 overflows U8`), mismatched types (`mismatched types U8 and I32 for '+'`, with a hint to convert).\n- Acceptance: **89 of 89 checks pass**, including the Project Euler and n-body cases; release performance is unchanged (n-body 0.96x of Rust).\n\n## Not yet\n\n- `sum` over sized integers (Int and Float only so far); ranges of sized integers.\n- `**` on sized integers (Go has no `**` at all; Int keeps it).\n- In `#![overflow(promote)]` files, an integer constant above 64 bits is still a compile error rather than a bignum.\n"}, {"id": "m2", "title": "M2: Everyday syntax", "group": "log", "md": "# M2: Everyday syntax\n\nThe constructs you reach for in every program, on all five backends. The test `acceptance/cases/syntax.alx` exercises all of them, and every backend prints the same 29 lines.\n\n## What you can write now\n\n```ruby\nfn half(x: Int) -> Int { x / 2 }              # fn = a pure def\n\u0192 area(r: Float) -> Float { 3.14159 * r * r } # so is \u0192\n\ndef classify(n: Int) -> Str {\n  case n {                                    # an expression\n    0 => \"zero\"\n    1 | 2 | 3 => \"small\"                      # alternatives\n    4...10 => \"medium\"                        # ranges\n    _ => \"large\"\n  }\n}\n\ndef sign(x: Float) -> Str {\n  case {                                      # no subject: conditions (Go's switch true)\n    x < 0 => \"negative\"\n    x == 0 => \"zero\"\n    _ => \"positive\"\n  }\n}\n\ndef grade(s: Int) -> Str {\n  if s >= 90 { \"A\" } else if s >= 80 { \"B\" } else { \"C\" }   # if is an expression\n}\n\nfor name, i in names.each_with_index {       # for loops, with destructuring\n  puts \"#{i}: #{name} (#{name.size} bytes)\"   # interpolation\n}\n\ndef countdown(n: Int) {\n  defer puts \"liftoff\"                        # runs when the block exits\n  ...\n}\n```\n\n## What was built\n\n- **`for x in xs { }`:** sugar over `each`, so it works on anything Enumerable (ranges, arrays, generators). `break`, `next` and `return` behave as in a Go `for range`. Several variables destructure tuples.\n- **`case`:** with a subject, arms match values, ranges and alternatives (`|`); without one, each arm is a condition. A case with `_` is an expression whose arms must agree on a type. Without `_` nothing may match, so the case has no value.\n- **`if` as an expression:** `x = if c { a } else { b }`, and a trailing `if`/`else` is the value of a function or block. `else if` joins `elsif`.\n- **Interpolation:** `\"#{expr}\"` with any expression, nested quotes included; it uses `format`'s `%v`, so numbers print the Go way. `\\#{` stays literal.\n- **`defer`:** block-scoped, as decided. Deferred code runs in reverse order when its block exits by falling through, `return` (after the return value is computed), `break` or `next`, or an error propagating through `try`. A `defer` inside a loop body runs at the end of each iteration.\n- **`fn` and `\u0192`:** a `def` that must be pure, checked like `#[pure]`.\n\nUnder the hood: `case` and value-`if` lower to conditionals over a statement sequence; `defer` lowers to cleanup code emitted at every exit, and the error paths of `try` now carry the cleanup each backend runs before propagating.\n\n## Tests\n\n- `syntax.alx`: 29 lines, identical on all five backends, including defer ordering with `return`, loops and `next`/`break`.\n- Defer on error propagation: nested fallible calls print their cleanup innermost first, then the error, with exit status 1 (JIT and clang).\n- Acceptance: **93 of 93 checks pass.**\n\n## Not yet\n\n- Enum patterns in `case` (M4) and exhaustiveness beyond `_`.\n- Interpolation inside heredocs.\n- `Array#reverse` (the method exists for Str only); M3 rebuilds arrays as slices.\n"}, {"id": "m3", "title": "M3: Collections and absence", "group": "log", "md": "# M3: Collections and absence\n\nGo's collection model with Ruby's spelling, on all five backends. The test `acceptance/cases/collections.alx` covers it, and every backend prints the same 65 lines.\n\n## What you can write now\n\n```ruby\na = [1, 2, 3, 4, 5]          # [Int]: a slice\nb = a                        # shares storage: b[0] = 10 changes a[0]\nmid = a[1..3]                # reslice (inclusive; a[1...3] exclusive; a[2..], a[...2])\nc = a.dup                    # own storage\ncopy(dst, a)                 # Go's copy: min(len), memmove semantics\n\nf: [Int; 3] = [1, 2, 3]      # fixed array: a value\ng = f                        # a copy; so is passing it to a def\ngrid: [[Int; 3]; 2] = [[0; 3]; 2]\nz: [Int; N] = [0; N]         # N is a constant\n\ns = \"h\u00e9llo, \u4e16\u754c\"\ns.size                        # 14: bytes, as in Go\ns[1]                          # 195: a Byte\ns.runes.count                 # 9 code points\ns[0..2] + \"!\"                 # \"h\u00e9!\"\nStr.from_bytes(buf)\n\nages = {\"ada\" => 36, \"bob\" => 25}    # Map[Str, Int], insertion-ordered\nages[\"cy\"] = 41\nif age = ages[\"bob\"] { ... }         # m[k] is an Int?\ncounts[w] += 1                       # a missing key reads as 0 (Go)\nages.delete(\"bob\")                   # Int?\nfor k, v in counts { ... }           # and every pipeline method: counts.select { |k, v| ... }\nputs ages                            # map[ada:36 bob:25 cy:41]\n\ndef find_even(xs: [Int]) -> Int? {\n  for x in xs { return x if x.even? }\n  none\n}\nputs u.boss || \"nobody\"              # || unwraps, ?. chains\nxs.find { it > 4 }                   # Int?\n```\n\n## What was built\n\n### Slices and fixed arrays (C1)\n\n- **`[T]` is a Go slice:** a `{ptr, len, cap}` header over shared storage. Assigning or passing one copies the header, so writes are visible through every alias. `<<` appends in place while there is capacity and reallocates otherwise, the same as Go's `append`.\n- **Reslicing:** `a[lo..hi]`, `a[lo...hi]` and either end left open. Bounds are checked: `slice bounds out of range at file:line:col`.\n  - A subslice has **no spare capacity**, so appending to it copies rather than overwriting the parent's next element (D6). This is the one deliberate departure from Go here.\n- **`[T; N]` is a value:** assignment, argument passing, struct fields, map values and option payloads all copy it, nested fixed arrays included. A slice taken from a fixed array views its storage, as in Go.\n  - `N` is any integer constant expression.\n  - A literal of the right length becomes a fixed array where one is expected. A wrong length is a compile error: `2 elements where [Int; 3] needs 3`.\n  - `<<` and `pop` are rejected; every read-only method works.\n- **`[v; n]`** makes `n` copies. When `v` holds storage, it is evaluated once per element, so rows are independent (D7).\n- **`dup`, `copy(dst, src)`.**\n\n### Strings are bytes (S3)\n\n- `size` is in bytes and `s[i]` is a `Byte` (bounds-checked). `s[lo..hi]` is a byte substring.\n- `bytes` yields `Byte`s; `runes` yields `Rune`s (U+FFFD for a bad lead byte); `chars` still yields one-character strings.\n- `Str + Str` concatenates. `Str.from_bytes([Byte])` copies.\n- Strings are immutable: `s[i] = b` is an error that points to `bytes` and `Str.from_bytes`.\n\n### Maps (C2)\n\n- **Syntax:**\n  - Types: `Map[K, V]`.\n  - Literals: `{k => v}`, `{name: v}` (Str keys) and `{}` (types inferred from use, or from a declaration).\n  - Struct fields of map type start as empty maps, and `Name.new` with no arguments zero-fills.\n- **Operations:**\n  - Reads: `m[k]` is `V?`, and `m.fetch(k, default)` gives the default when the key is missing.\n  - Writes: `m[k] = v`, and `m[k] op= v` (a missing key reads as V's zero, as in Go).\n  - Queries and copies: `key?`, `delete(k)` (returns `V?`), `size`, `empty?`, `keys`, `values`, `dup`.\n  - Iteration: `for k, v in m` and every pipeline method over `(k, v)` pairs.\n- **Semantics:**\n  - Maps are shared, like Go maps.\n  - Order is insertion order. Deleting while iterating is fine.\n  - `puts` prints Go's `map[k:v ...]` (D8).\n  - Keys are integer types, Str or Bool for now.\n- **Implementation:** the map is written once, in LIR, rather than five times in five runtimes.\n  - The compiler generates `find`/`set`/`delete` functions per key and value type: open addressing over insertion-ordered entry arrays, with a murmur3 finalizer (FNV-1a for strings, and for bignum keys in promote mode via their digits).\n  - Every backend sees ordinary functions and arrays.\n  - It is quick: 2M upserts and 2M lookups take 0.07 s of CPU in a release build versus 0.11 s for Go's map.\n\n### Absence (C3)\n\n- `T?` everywhere a type goes.\n  - Narrowing: `if x = e` and `while x = e`.\n  - Operators and methods: `x || default`, `x?.m`, `present?`, `none?`, `unwrap`, `unwrap_or`.\n  - Absent values: `none`. A plain `T` is accepted where a `T?` is expected.\n  - `if`/`else` and `case` arms mixing `T` and `T?` values join to `T?`.\n- `find`/`detect`, `m[k]` and `m.delete(k)` return `T?`. `max`, `min`, `first` and `reduce` still panic on an empty collection, like Go's `slices.Max` (D5).\n\n### Under the hood\n\n- **The Rust oracle's slices:** a slice there is now `Sl<T>`, a window onto `Arc<Mutex<Vec<T>>>`. That gives Go sharing semantics in safe Rust; nested writes go through closures.\n- **Value copies:** fixed arrays and anything holding one are copied by `copy_value` at stores, unless the expression already built a fresh value.\n- **pe022** changed `it - 64` to `it.to_i - 64`, because `bytes` now yields `Byte`s. Go needs the same conversion.\n\n## Decisions made on the way (logged as D5 to D9)\n\n| # | Call |\n|---|---|\n| D5 | `max`/`min`/`first`/`reduce` panic on empty; `find`, `m[k]`, `delete` give `T?` |\n| D6 | subslices have no spare capacity: `<<` onto one copies (avoids Go's `append` aliasing) |\n| D7 | `[v; n]` evaluates a storage-holding fill per element |\n| D8 | maps print Go's `map[k:v]` in insertion order; keys are ints, Str, Bool |\n| D9 | `copy(dst, src)` is Go's, with memmove semantics |\n\n## Tests\n\n- `collections.alx`: 65 lines, identical on the JIT, clang debug, clang release, ASan/UBSan and the Rust oracle, and in the browser (wasm).\n- Negative cases:\n  - `collections.bad1` and `collections.bad2` are compile errors: fixed-array length, and pushing onto a fixed array.\n  - `collections.oob` is a runtime failure (slice bounds).\n- Acceptance: **100 of 100 checks pass.** The browser suite passes 26 of 26.\n\n## Not yet\n\n- **Deferred:**\n  - Map keys that are tuples or structs (needs struct equality, M4).\n  - `m[k][i] = v` through a map.\n  - `==` on arrays and maps.\n- **Gaps:**\n  - `runes` doesn't replace every invalid sequence with U+FFFD the way Go does (only a bad lead byte).\n  - `puts {\u2026}` parses the braces as a block, as in Ruby; bind the map first.\n  - A block call inside an `if` or `while` condition needs parentheses: `if x = (xs.find { ... }) { }`.\n"}, {"id": "m4", "title": "M4: Types", "group": "log", "md": "# M4: Types\n\nMethods, operators, enums, interfaces, generics and lambdas, on all five backends. The test `acceptance/cases/types.alx` covers them, and every backend prints the same 31 lines.\n\n## What you can write now\n\n```ruby\nstruct Point {\n  x: Float\n  y: Float\n  def norm -> Float { (x * x + y * y).sqrt }   # fields read bare\n  def move!(dx: Float, dy: Float) {             # `!` changes the receiver\n    self.x += dx\n    self.y += dy\n  }\n}\np.move!(1.0, 1.0)            # also b.pos.move!(...), ps[1].move!(...)\n\nstruct V2 {\n  x: Int\n  y: Int\n  def +(o: V2) -> V2 { ... }\n  def <=>(o: V2) -> Int { ... } # gives < <= > >=\n  def to_s -> Str { \"(#{x}, #{y})\" }\n}\na == b                        # field by field, no method needed\n\nenum Shape {\n  Circle(r: Float)\n  Rect(w: Float, h: Float)\n  Empty\n  def area -> Float {\n    case self {               # must cover every variant (or `_`)\n      Circle(r) => 3.0 * r * r\n      Rect(w, h) => w * h\n      Empty => 0.0\n    }\n  }\n}\nenum Color { Red, Green, Blue }  # Go's iota: Color.Blue.to_i == 2\n\ninterface Named {\n  def name -> Str\n  def greeting -> Str { \"hello, #{name}\" }   # default\n}\nnamed: [Named] = [Dog.new, Robot.new(id: 7)] # satisfied structurally\n\nstruct Stack[T] { items: [T]; def push!(x: T) { self.items << x } }\ns = Stack[Int].new           # or inferred: Stack.new(items: [\"a\"])\ndef largest[T](xs: [T]) -> T { ... }\ndef sum_all[N: like Int](xs: [N]) -> N { ... }\ndef greet[T: Named](x: T) -> Str { ... }\n\ndouble = ->(x: Int) -> Int { x * 2 }\ndef make_adder(n: Int) -> (Int) -> Int { ->(x: Int) { x + n } }\nops: [(Int, Int) -> Int] = [->(a, b) { a + b }, ->(a, b) { a * b }]\nops.each { puts it(6, 7) }\n```\n\n## What was built\n\n### Methods (F1)\n\n- **Declaration:** a struct or enum body holds `def`s, compiled as functions named `Type.method` with `self` first.\n- **Inside a method:**\n  - Fields are read bare (`x`). Methods are called bare (`norm`, `move!(...)`).\n- **Writes (D10):**\n  - Writes to fields must be spelled `self.x = ...`.\n  - Assigning to a bare field name is an error, so it can't silently make a shadowing local.\n- **`!` methods:** a `!` method gets a one-element slice holding its receiver.\n  - The call site passes the place and writes the receiver back.\n  - This is Go's pointer receiver, without pointers, and it works through fields and elements (`b.pos.move!`, `ps[1].move!`).\n- **Plain methods:** a plain method gets a copy, and assigning to its `self` is an error that suggests `!` (D11).\n- **Pushing through places:** `self.items << x` and `grid[i] << x` push through the place: read the header, push, write it back.\n\n### Operators and equality (T4)\n\n- **Operators:** `def + - * / %`, `def ==`, `def <=>` (which gives the four comparisons) and `def []` hook the operators.\n- **Default `==`:** without `def ==`, structs, tuples and enums compare field by field (Go's comparable types). A slice or map field makes `==` an error that suggests `def ==` (D13).\n\n### Printing (D14)\n\nPrinting follows Go's `%v`:\n- Slices print as `[1 2 3]` and structs as `{1 2}`.\n- Enums print as `Circle(1)` or `Red`.\n- A type's `to_s` is used wherever it's printed, inside slices and maps too (Go's `Stringer`). The checker instantiates every `to_s` reachable from a printed type.\n\n### Enums (T5, T6)\n\n- **Variants:** named or positional fields.\n  - Build them with `Shape.Circle(1.0)`, `Shape.Rect(w: 2.0, h: 3.0)` or `Color.Red`.\n  - Enums can have methods and can be generic.\n- **`case`:** binds payloads (`Circle(r)`, `Rect(w, _)`) and must cover every variant or have `_`. The error names what's missing.\n- **Payload-free enums** are Go's `iota` constants: `to_i`, `==`.\n- **Representation:** a value holds the tag plus every variant's fields side by side. That costs a little space and needs nothing new from any backend.\n\n### Interfaces (F2, D12)\n\n- **Declaration:** required methods have no body. Default methods have a body and see the concrete `self`.\n- **Satisfaction:** a struct or enum satisfies an interface by having the methods, checked with their types where it is converted.\n  - Conversion is implicit wherever the interface is wanted: declarations, arguments, slice literals, `<<`.\n- **Defaults on concrete values:** default methods work directly on concrete values too (`Dog.new.greeting`).\n- **Representation: closed-world sums.**\n  - The compiler sees the whole program, so an interface value is a tag plus a slot for each type ever converted to it, and a call dispatches on the tag to each implementor's method instance.\n  - No boxing, no vtables, no GC: the representation waits on the memory-model conversation like everything else.\n\n### Generics (T3)\n\n- **Declaration:**\n  - Type parameters go on structs, enums and defs: `[T]`, `[K, V]`, with bounds `T: Interface` and `N: like Int`.\n  - Bounds are checked when an instance is made.\n- **Instances:** each one is a distinct type named `Stack[Int]`, and its methods are checked per instance (monomorphized).\n- **Inference (D15):** type arguments come from constructor values, from the declared type (`t: Stack[Str] = Stack.new`), or are spelled out (`Stack[Int].new`).\n\n### Lambdas (D16)\n\n- **Syntax:** `->(x: T) -> R { }`, type `(T) -> R`, called `f(x)` or `f.call(x)`.\n  - Parameter types can come from the wanted function type: `apply(->(x) { x - 1 })`.\n  - `return` returns from the lambda.\n- **Representation:** the same closed-world trick. A function value is a tag plus the captured values of each lambda literal of that type, and every literal becomes its own function.\n- **Captures are copies.** Slices and maps still share their storage, so `counts[\"n\"] += 1` inside a lambda is visible outside, but a captured Int counter isn't.\n  - This is the one place we differ from Go's by-reference closures. It gets revisited with the memory model.\n\n## Tests\n\n- `types.alx`: 31 lines, identical on the JIT, clang debug and release, ASan/UBSan, the Rust oracle and wasm.\n- Negative cases:\n  - `types.bad1` is a non-exhaustive `case`.\n  - `types.bad2` is a type missing an interface method.\n  - `types.bad3` assigns `self` in a non-`!` method.\n- Acceptance: **107 of 107 checks pass.** The browser suite passes.\n\n## Not yet\n\n- **Waits on the memory model:**\n  - Recursive types (`enum Tree { Node(left: Tree, ...) }`, even through slices).\n  - Mutable captured variables.\n- **Interfaces:**\n  - `!` methods in interfaces (Go's `io.Writer` on a pointer). Needed before porting `io`.\n  - Interface methods count as impure, so a `fn` can't call them.\n- **Function values:** fallible lambdas, and lambdas compared with `==`.\n- **`<=>` and sorting:** `<=>` doesn't feed `sort` yet. Use `max_by`/`min_by`, which now take Int, Float or Str keys.\n"}, {"id": "m5", "title": "M5: Errors", "group": "log", "md": "# M5: Errors\n\nRust-shaped errors in this language's spelling. Errors are values, `~` propagates them, and declared error sets are checked. The test `acceptance/cases/errors.alx` prints the same 15 lines on all five backends.\n\n## What you can write now\n\n```ruby\nerror ParseError {\n  Empty\n  BadDigit(at: Int, ch: Str)\n\n  def message -> Str {                 # optional; default prints the value\n    case self {\n      Empty => \"empty input\"\n      BadDigit(at, ch) => \"bad digit `#{ch}` at #{at}\"\n    }\n  }\n}\n\ndef parse(s: Str) -> ~Int<ParseError | ArithError> {\n  fail ParseError.Empty if s.size == 0\n  n = 0\n  for c in s.chars {\n    ...\n    n = ~(n * 10 + d)                  # overflow becomes an ArithError\n  }\n  n\n}\n\ndef sum_all(xs: [Str]) -> ~Int {       # set inferred\n  total = 0\n  for x in xs { total += ~parse(x) }   # propagate\n  total\n}\n\ndef checked(s: Str) -> ~Int<Error> {   # open: anything\n  v = ~parse(s)\n  fail \"too big: #{v}\" if v > 1000     # a Failure\n  v\n}\n\nr = sum_all([\"12\", \"x3\"])              # no `~`: a ~Int value\nr.ok?  r.unwrap_or(-1)  r.ok  r.err  r.unwrap\nv = parse(\"4z\").rescue { |e| -1 }\ncase e {\n  Empty => ...\n  BadDigit(at, _) => ...\n  Overflow => ...                      # a builtin ArithError variant\n  Failure => ...                       # a whole error type\n  _ => ...\n}\ne.wrap(\"reading config\")               # \"reading config: empty input\"\nnames = ~File.read(\"names.txt\")        # at the top level: print and exit 1\n```\n\n## What was built\n\n- **Spelling (E1\u2013E4):**\n  - **Types:** `~T`, `~T<E | F>` and `~T<Error>`, with `< >` reserved for error sets.\n  - **Propagation:** prefix `~` attaches to the next call, so `~load(p).~section(\"db\")` propagates both. `~(a * b)` checks arithmetic, and `~r` propagates a held Result.\n  - **Old syntax:** `try` and `-> T!` are gone, with errors that show the new spelling.\n- **`error` declarations:** these are enums, so they get variants, fields, methods and `case`. `fail` takes an error value, or a Str (which becomes `Failure.Msg`).\n- **Error sets (D20):**\n  - The checker tracks what each function can fail with: its `fail`s, the `~`s on callees (whose sets were inferred the same way), `~(arith)` and `File.read`.\n  - A declared `~T<...>` that misses one is an error naming the type: ``can fail with ArithError, which its `~T<ParseError>` doesn't list``.\n- **Results as values (D21):**\n  - Without `~`, a fallible call is a `~T`, at the top level too, so there is no implicit exit any more.\n  - Methods: `ok`, `err`, `ok?`, `err?`, `unwrap`, `unwrap_or` and `rescue { |e| ... }`.\n- **Errors:**\n  - `message` and `wrap`; they print as their message.\n  - `case` matches variants of any error type unqualified, or a type by name. It needs `_`, because an `Error` is open.\n- **Uncaught errors (D19):** `error: <message> (<file:line:col>)` on stderr, then exit 1, after running any `defer`s on the way out.\n\n### Under the hood\n\n- **Errors as values in the IR:**\n  - A fallible function returns an ordinary tuple: ok, value and an `Error`.\n  - The `Error` is one sum over every error type in the program: a type tag, the location, the wrap context, then each type's value (D17).\n  - `~` is a test and an early return, after running the `defer` cleanup. The error message comes from one generated function.\n- **Builtin failures become plain checks:**\n  - Overflow under `~(...)` is a bit test, for example `((a ^ r) & (b ^ r)) < 0` for addition.\n  - `File.read` checks the file's status first.\n  - So the backends needed only three new primitives (a dynamic `die`, a file-status check and a file read), and the old per-backend error calling convention became dead code.\n  - A Sonnet agent added the primitives, and another removed the dead code.\n- **`pmap`:** a block using `~` returns a Result per element, and the first failing element's error propagates once the workers finish.\n- **Existing programs:** `pe014` and `pe022` moved to `~`.\n\n## Tests\n\n- `errors.alx`: 15 lines, identical on the JIT, clang debug and release, ASan/UBSan, the Rust oracle and wasm.\n- Negative cases:\n  - `errors.bad1` is an unlisted error type.\n  - `errors.bad2` uses `~` in a non-fallible def.\n  - `errors.bad3` uses the old `-> T!`.\n  - `errors.die` is an uncaught error: exit 1, with the message and location.\n- Acceptance: **115 of 115 checks pass.**\n\n## Not yet\n\n- **Matching:** exhaustive `case` over a closed error set (it needs `_` for now). Qualified patterns (`IoError.NotFound(p)`).\n- **Error information:** `e.cause`, and stack traces or propagation paths (the location is where it was raised).\n- **Lambdas:** `~` and `fail` inside lambdas.\n- **Tooling:** warnings for unused Results (M8, with the other warnings).\n"}, {"id": "m6", "title": "M6: Packages and refinements", "group": "log", "md": "# M6: Packages and refinements\n\nGo's directory packages with an explicit `pub`, Go modules (minus downloading), and Ruby's refinements, lexically scoped. The test programs `packages.alx` and `refinements.alx` print the same output on all five backends, and the `modtest` fixture checks module resolution.\n\n## What you can write now\n\n```ruby\n# pkgs/geom/point.alx  (every .alx file in pkgs/geom/ is package `geom`)\npub struct Point {\n  x: Float\n  y: Float\n  pub def norm -> Float { (x * x + y * y).sqrt }\n  def secret -> Float { 42.0 }          # not callable outside geom\n}\npub def dist(a: Point, b: Point) -> Float { ... }\npub refine Units for Float {\n  pub def cm -> Float { self * 100.0 }\n}\n\n# main.alx\nimport \"pkgs/geom\"\nimport sh \"pkgs/shapes\"                  # an alias\n\np = geom.Point.new(x: 3.0, y: 4.0)\nputs geom.dist(p, geom.origin)\ns = geom.Stack[Int].new                  # generic types across packages\na = ~sh.circle(0.0, 0.0, 1.0)            # errors across packages\npt: geom.Point = geom.origin             # qualified types\nusing geom.Units\nputs 2.5.cm\n\nrefine Shouty for Str {\n  def shout -> Str { self + \"!\" }\n}\ndef quiet(s: Str) -> Str { s }           # no `shout` here\nusing Shouty                             # from here to the end of the file\nputs \"hi\".shout\ndef scoped -> Float {\n  if c {\n    using Metric                         # only inside this block\n    ...\n  }\n}\n```\n\n```\n# alx.mod\nmodule example.com/app\nrequire example.com/lib v1.0.0\nrequire example.com/dep2 v1.0.0\nreplace example.com/lib => ./deps/lib\n```\n\n## What was built\n\n### Packages (P1, D22, D23)\n\n- **Imports:** `import \"path\"` loads a package, which is every `.alx` file in that directory except `*_test.alx`.\n  - Paths resolve under the module root (the nearest directory up with an `alx.mod`), or through a required module.\n  - Packages import packages, and cycles are an error naming the chain.\n  - `require` is gone, with an error pointing at `import`.\n- **Naming:** a package's declarations are qualified by its path.\n  - Inside the package, names resolve package-first.\n  - Outside, they're reached as `alias.name`, `alias.Type` and `alias.CONST`, in types too (`geom.Point`, `geom.Stack[Int]`).\n  - The callee's signature is resolved in the callee's package.\n- **Visibility:** `pub` on a def, struct, enum, error, interface, constant, refinement or method. Using anything else from outside is an error that names it.\n- **Separate compilation (A6's library reuse):**\n  - Packages whose exports are plain typed defs still compile to a cached object behind a header, so `lib/primes` builds once.\n  - Packages whose layout depends on the whole program (interfaces, errors, generics) are checked with the program.\n  - `alx run` always JIT-compiles the whole program from source.\n\n### Modules (P6, D25), built by a Sonnet agent\n\n- **`alx.mod` grammar:** `module`, `require`, `replace` (also in `( ... )` blocks).\n- **Dependency imports:** they resolve through the longest required module prefix. A module's directory is its `replace` target, or `$ALX_MODCACHE/<module>@<version>` (default `~/.alx/mod`).\n- **Version selection:** Go's minimal version selection, which picks the highest version any module's `alx.mod` requires. The fixture proves `dep2 v1.2.0` wins over the main module's `v1.0.0`.\n- **Not yet:** downloading and `alx.sum`. A module missing from the cache is an error that says so.\n\n### Refinements (D24)\n\n- **Declaration:** `refine Name for Type { defs }` adds methods to any type, builtins included. Several blocks with the same name accumulate (`Shouty for Str`, `Shouty for Int`).\n- **Activation:** `using Name` activates them for the rest of the enclosing block, or for the rest of the file at the top level (including the defs below it).\n  - Refinements are lexical: a def declared above the `using` doesn't see them.\n  - An active refinement wins over the type's own methods.\n  - A refinement's methods see each other.\n\n## Tests\n\n- `packages.alx`:\n  - Two packages, one importing the other, with private and `pub` members.\n  - A generic struct, a `!` method, an error type and a refinement, all used across the boundary.\n- `refinements.alx`: file-level and block-level `using`, precedence over the type's own methods, and a def above the `using` that doesn't see it.\n- Negative cases:\n  - `packages.bad1` and `packages.bad2` use a private def and a private method.\n  - `packages.bad3` imports a missing package.\n  - `refinements.bad1` calls a refined method without `using`.\n- Module checks: require, replace and MVS output; an unrequired import; a module missing from the cache.\n- Acceptance: **130 of 130 checks pass.**\n\n## Not yet\n\n- Field-level `pub`, so fields of a public type are visible.\n- A main package spanning several files (the main program is one file).\n- Downloading modules, `alx.sum`, and `alx get`/`alx mod tidy`.\n- Refinements of generic types (`refine X for [T]`) and `!` methods in refinements.\n- Packages in the browser playground (it has no directories beyond its bundled files).\n"}, {"id": "m7", "title": "M7: Concurrency", "group": "log", "md": "# M7: Concurrency\n\nGo's model with this language's spelling: tasks, channels and `select`. A panic ends only its own task. The test `acceptance/cases/concurrency.alx` prints the same 13 lines on the JIT, clang debug, release, ASan/UBSan and the Rust oracle.\n\n## What you can write now\n\n```ruby\ndef produce(ch: Chan[Int], n: Int) {\n  (1..n).each { ch << it }\n  ch.close\n}\n\nnums = Chan[Int].new(4)          # buffered\nsquares = Chan[Int].new          # unbuffered: a rendezvous\nspawn produce(nums, 10)\nsq = spawn {\n  for v in nums { squares << v * v }\n  squares.close\n  \"squarer done\"\n}\ntotal = 0\nfor s in squares { total += s }  # until closed\nputs sq.wait.unwrap              # wait gives a ~T\n\nworkers = (1..4).map { |w| spawn { ... } }.to_a\nhandled = workers.sum { it.wait.unwrap }\n\nr = (spawn { [1, 2, 3][7] }).wait   # a panic ends only its task\nr.ok?                            # false; r.err is a TaskError\n\nt = spawn { ~check(-5) }         # a body's errors come back through wait\n\nselect {\n  when v = a.recv => puts \"a: #{v}\"   # v is a T? (none once closed)\n  when out.send(42) => puts \"sent\"\n  else => puts \"nothing ready\"\n}\n```\n\n## What was built\n\n- **Language:**\n  - `spawn { body }` / `spawn f(x)` gives a `Task[T]`. The body gets copies of the locals it uses, and slices, maps and channels inside still share storage.\n  - `t.wait` is a `~T`. It holds the body's value, the body's error if it used `~`, or a `TaskError` if it panicked. It can be waited on again.\n  - Channels: `Chan[T].new(cap)` with `send`/`<<`, `recv` (a `T?`), `close`, `size`, and Enumerable (`for v in ch`, `ch.sum`).\n  - `select { when v = ch.recv => ...; when ch.recv => ...; when ch.send(x) => ...; else => ... }`.\n- **Design (D26\u2013D28):**\n  - **Panic isolation (F6):** a runtime panic in a task (bounds, overflow, `unwrap`, send on a closed channel) ends that task, and `wait` reports it. The main thread still aborts.\n  - **Deadlock detection:** \"all tasks are asleep: deadlock\" when every live thread is blocked.\n  - **Browser:** the playground refuses concurrency at compile time, since it has no threads.\n- **IR:** handle types `Task`/`Chan` and operations `Spawn`, `Wait`, `ChanSend`, `ChanRecv`, `ChanClose`, `Select`, `ChanNew` and `ChanLen`, specified in `lir.rs`. `spawn` reuses `pmap`'s worker machinery, with the captured copies as the worker's input.\n- **Backends, built by Sonnet agents in parallel against that spec:**\n  - **C runtime** (pthreads; also used by the JIT through shims):\n    - Tasks run on detached threads; the result goes into a heap buffer that `wait` reads.\n    - Channels are ring buffers, with a real rendezvous for unbuffered ones.\n    - `select` shuffles its cases and makes non-blocking attempts. Blocked selects register as waiting senders or receivers, so two selects can meet.\n    - A task records a panic and `longjmp`s back to its entry instead of aborting.\n    - The runtime has its own test (`compiler/runtime/tests/tasks_test.c`), clean under ASan and TSan.\n  - **Rust oracle:** `Task<T>`/`Chan<T>` in safe Rust (`Arc`/`Mutex`/`Condvar`). A task's panic unwinds quietly into its result.\n  - **wasm:** a compile error.\n\n## Tests\n\n- `concurrency.alx`:\n  - a three-stage pipeline (buffered and unbuffered channels);\n  - a worker pool of 4 over 100 jobs;\n  - a panicking task and a failing task, both reported through `wait`;\n  - `select` with a ready case, with `else`, and on a closed channel;\n  - a `select` send.\n- Negative: `concurrency.deadlock` (a receive nobody will ever send to).\n- The browser test checks that concurrency is refused cleanly.\n- Acceptance: **137 of 137 checks pass.**\n\n## Not yet\n\n- **Scheduling:** an M:N scheduler (goroutine-cheap tasks). Tasks are OS threads with 8 MB stacks, so thousands are fine and millions aren't.\n- **Missing pieces:**\n  - `Context` (cancellation and deadlines) and timers (`time.After`). These come with the standard library port, as alx packages on top of channels.\n  - Shared-memory synchronization beyond channels (`Mutex`, `WaitGroup`, atomics), and a race detector.\n  - Concurrency in the browser.\n- **Known gap:** a `select` waiting to receive that commits to another case can leave an unbuffered sender in a send-`select` waiting for the next receiver. That is slightly looser than Go.\n- **Ownership:** data races on shared slices and maps aren't prevented. That belongs to the memory-model conversation.\n"}], "milestones": [{"id": "m1", "num": "M1", "name": "Numbers", "contents": "`I8..I64`, `U8..U64`, `Byte`, `Rune` (Int = I64); hex/octal/binary literals; bitwise `& \\| ^ << >> &^` and unary `^`; wrapping `+% -% *%`; explicit conversions (`x.to_u32`); per-type overflow checks; Go's exact constants and top-level `const` (visible inside defs)", "done": true}, {"id": "m2", "num": "M2", "name": "Everyday syntax", "contents": "`for x in xs`; `case x { pat => v }` (values, ranges, `_`); `\"#{x}\"` interpolation; block-scoped `defer`; `fn` / `\u0192` = `#[pure] def`; `else if`", "done": true}, {"id": "m3", "num": "M3", "name": "Collections and absence", "contents": "C1: `[T]` slices (shared storage, `a[lo...hi]`, append, `copy`), `[T; N]` fixed arrays; Str as bytes (`s[i]` is a Byte, `bytes`, `runes`); ordered `Map[K, V]` with literals; `T?` with narrowing (`if x = e`), `\\|\\|`, `?.`, `none`; lookups, `find`, `first`, `max` return `T?`", "done": true}, {"id": "m4", "num": "M4", "name": "Types", "contents": "methods inside structs (`def m!` mutates); `enum` with payloads and exhaustive `case`; structural `interface`s with default methods; operator overloading through interfaces; explicit generics `[T]` on defs and structs (`like Int` bounds); escaping lambdas `->(x) { }`", "done": true}, {"id": "m5", "num": "M5", "name": "Errors", "contents": "`error` declarations; `~T`, `~T<E>`, `~T<Error>`; `~` propagation (replaces `try`); inferred closed sets; Results as values; `rescue`, `fail`, `case` over errors, `wrap`/`cause`; printing", "done": true}, {"id": "m6", "num": "M6", "name": "Packages and refinements", "contents": "directory packages, const byId = Object.fromEntries(DATA.docs.map(d => [d.id, d]));
const planNav = document.getElementById('nav-plan');
const msNav = document.getElementById('nav-ms');
const doc = document.getElementById('doc');

function link(href, tag, name, cls) {
  const a = document.createElement('a');
  a.className = 'navlink ' + (cls || '');
  a.href = '#' + href;
  a.dataset.id = href;
  const t = document.createElement('span'); t.className = 'tag'; t.textContent = tag;
  const n = document.createElement('span'); n.className = 'name'; n.textContent = name;
  a.append(t, n);
  return a;
}
planNav.append(link('roadmap', '→', 'Roadmap'), link('decisions', '↔', 'Go vs Ruby decisions'));
if (byId.m0) msNav.append(link('m0', 'M0', 'Where things stood', ''));
for (const m of DATA.milestones) {
  msNav.append(link(m.id, m.num, m.name, m.done ? '' : 'planned'));
}

function progressStrip() {
  const wrap = document.createElement('div');
  wrap.className = 'progress';
  for (const m of DATA.milestones) {
    const a = document.createElement('a');
    a.className = 'step' + (m.done ? ' done' : '');
    a.href = '#' + m.id;
    const n = document.createElement('span'); n.className = 'n';
    const l = document.createElement('span'); l.textContent = m.num;
    const s = document.createElement('span'); s.textContent = m.done ? 'done' : 'planned';
    n.append(l, s);
    const t = document.createElement('span'); t.className = 't'; t.textContent = m.name;
    a.append(n, t);
    wrap.append(a);
  }
  return wrap;
}

function render() {
  const id = (location.hash || '#roadmap').slice(1);
  doc.replaceChildren();
  let d = byId[id];
  if (!d) {
    const m = DATA.milestones.find(x => x.id === id);
    if (m) {
      d = { md: `# ${m.num}: ${m.name}\n\nNot started yet. This milestone covers: ${m.contents}\n\nIts write-up appears here when it's done.` };
    } else {
      d = byId.roadmap;
    }
  }
  if (id === 'roadmap' || !location.hash) {
    const h = document.createElement('h1'); h.textContent = 'Roadmap';
    const meta = document.createElement('p'); meta.className = 'meta';
    const done = DATA.milestones.filter(m => m.done).length;
    meta.textContent = `${done} of ${DATA.milestones.length} milestones done`;
    doc.append(h, meta, progressStrip());
    const body = document.createElement('div');
    body.innerHTML = marked.parse(d.md.replace(/^# .+\n/, ''));
    doc.append(body);
  } else {
    doc.innerHTML = marked.parse(d.md);
  }
  for (const t of doc.querySelectorAll('table')) {
    const w = document.createElement('div'); w.className = 'tablewrap';
    t.replaceWith(w); w.append(t);
  }
  for (const a of document.querySelectorAll('.navlink')) a.classList.toggle('current', a.dataset.id === id || (!location.hash && a.dataset.id === 'roadmap'));
  window.scrollTo(0, 0);
}
addEventListener('hashchange', render);
render();
</script>
