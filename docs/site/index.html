tal = 0\nfor s in squares { total += s }  # until closed\nputs sq.wait.unwrap              # wait gives a ~T\n\nworkers = (1..4).map { |w| spawn { ... } }.to_a\nhandled = workers.sum { it.wait.unwrap }\n\nr = (spawn { [1, 2, 3][7] }).wait   # a panic ends only its task\nr.ok?                            # false; r.err is a TaskError\n\nt = spawn { ~check(-5) }         # a body's errors come back through wait\n\nselect {\n  when v = a.recv =\u003e puts \"a: #{v}\"   # v is a T? (none once closed)\n  when out.send(42) =\u003e puts \"sent\"\n  else =\u003e puts \"nothing ready\"\n}\n```\n\n## What was built\n\n- **Language:**\n  - `spawn { body }` / `spawn f(x)` gives a `Task[T]`. The body gets copies of the locals it uses, and slices, maps and channels inside still share storage.\n  - `t.wait` is a `~T`. It holds the body's value, the body's error if it used `~`, or a `TaskError` if it panicked. It can be waited on again.\n  - Channels: `Chan[T].new(cap)` with `send`/`\u003c\u003c`, `recv` (a `T?`), `close`, `size`, and Enumerable (`for v in ch`, `ch.sum`).\n  - `select { when v = ch.recv =\u003e ...; when ch.recv =\u003e ...; when ch.send(x) =\u003e ...; else =\u003e ... }`.\n- **Design (D26–D28):**\n  - **Panic isolation (F6):** a runtime panic in a task (bounds, overflow, `unwrap`, send on a closed channel) ends that task, and `wait` reports it. The main thread still aborts.\n  - **Deadlock detection:** \"all tasks are asleep: deadlock\" when every live thread is blocked.\n  - **Browser:** the playground refuses concurrency at compile time, since it has no threads.\n- **IR:** handle types `Task`/`Chan` and operations `Spawn`, `Wait`, `ChanSend`, `ChanRecv`, `ChanClose`, `Select`, `ChanNew` and `ChanLen`, specified in `lir.rs`. `spawn` reuses `pmap`'s worker machinery, with the captured copies as the worker's input.\n- **Backends, built by Sonnet agents in parallel against that spec:**\n  - **C runtime** (pthreads; also used by the JIT through shims):\n    - Tasks run on detached threads; the result goes into a heap buffer that `wait` reads.\n    - Channels are ring buffers, with a real rendezvous for unbuffered ones.\n    - `select` shuffles its cases and makes non-blocking attempts. Blocked selects register as waiting senders or receivers, so two selects can meet.\n    - A task records a panic and `longjmp`s back to its entry instead of aborting.\n    - The runtime has its own test (`compiler/runtime/tests/tasks_test.c`), clean under ASan and TSan.\n  - **Rust oracle:** `Task\u003cT\u003e`/`Chan\u003cT\u003e` in safe Rust (`Arc`/`Mutex`/`Condvar`). A task's panic unwinds quietly into its result.\n  - **wasm:** a compile error.\n\n## Tests\n\n- `concurrency.alx`:\n  - a three-stage pipeline (buffered and unbuffered channels);\n  - a worker pool of 4 over 100 jobs;\n  - a panicking task and a failing task, both reported through `wait`;\n  - `select` with a ready case, with `else`, and on a closed channel;\n  - a `select` send.\n- Negative: `concurrency.deadlock` (a receive nobody will ever send to).\n- The browser test checks that concurrency is refused cleanly.\n- Acceptance: **137 of 137 checks pass.**\n\n## Not yet\n\n- **Scheduling:** an M:N scheduler (goroutine-cheap tasks). Tasks are OS threads with 8 MB stacks, so thousands are fine and millions aren't.\n- **Missing pieces:**\n  - `Context` (cancellation and deadlines) and timers (`time.After`). These come with the standard library port, as alx packages on top of channels.\n  - Shared-memory synchronization beyond channels (`Mutex`, `WaitGroup`, atomics), and a race detector.\n  - Concurrency in the browser.\n- **Known gap:** a `select` waiting to receive that commits to another case can leave an unbuffered sender in a send-`select` waiting for the next receiver. That is slightly looser than Go.\n- **Ownership:** data races on shared slices and maps aren't prevented. That belongs to the memory-model conversation.\n"}, {"id": "m8", "title": "M8: Tooling", "group": "log", "md": "# M8: Tooling\n\nThe everyday tools Go users expect: warnings, a formatter and a test runner. With this milestone the Go-parity push is complete. Most of the tooling was built by Sonnet agents working in parallel worktrees against specs from the decisions log.\n\n## Warnings (P3, D29)\n\n```\nwarning: `unused` is assigned but never used\n  --\u003e calc.alx:3:3\n   |\n  3|   unused = n * 2\n   |   ^\n   = use it, or name it `_` or `_name`\nwarning: `pk` is imported but not used\n```\n\n- **What warns:** locals that are assigned but never read, and imports nothing refers to. A leading `_` silences one.\n- **When they're errors:** under `--strict` and in `alx test`.\n- **Not included:** parameters don't warn (Go doesn't either).\n\n## `alx fmt` (P4, D30)\n\n```\nalx fmt file.alx dir/          # rewrite in place\nalx fmt --check acceptance/cases   # list files that would change; exit 1 if any\nalx fmt - \u003c in.alx \u003e out.alx\n```\n\n- **How it works:** it uses the compiler's own lexer and rebuilds only the whitespace between tokens.\n  - Every result is re-lexed and compared token by token with the input, so formatting can't change meaning. If anything differs, it writes nothing.\n  - Strings, interpolation, heredocs and `ƒ` are copied byte-for-byte.\n- **The style:**\n  - Two-space indentation by bracket nesting.\n  - Spaces around binary operators. `{ x }` blocks, but tight `{k =\u003e v}` map literals.\n  - At most one blank line. Line breaks are never added or removed, since newlines end statements.\n  - Trailing comments are aligned in runs, as gofmt does.\n- **Tests:**\n  - Every acceptance case is a fixed point.\n  - The suite checks `alx fmt --check` over the cases.\n  - `cargo test` runs the formatter's own tests: idempotence, token equality and style cases.\n\n## `alx test` (P5, D31)\n\n```ruby\n# calc_test.alx, next to calc.alx (same package: private defs are visible)\ntest \"adds\" {\n  assert_eq add(2, 3), 5\n}\ntest \"parses\" {\n  n = ~parse(\"42\")          # an error reaching the top fails the test\n  assert n \u003e 0\n}\nbench \"add\" {\n  add(1, 2)\n}\nexample \"greeting\" {\n  puts greet(\"ada\")\n} outputs \"hello ada\"\n```\n\n```\n$ alx test\n=== RUN   adds\n--- PASS: adds (0.00s)\n=== RUN   parses\n--- FAIL: parses (0.00s)\n    assertion failed: n \u003e 0 at calc_test.alx:7:3\nPASS / FAIL\nok     . 0.012s\n```\n\n- **Running:**\n  - Each test, example and benchmark runs as its own task (M7), so a failing assertion, a panic or an error fails that test only.\n  - Flags: `-run NAME` and `-bench NAME` filter by substring, `-benchtime 2s` sets the benchmark time, and `--release` uses the C backend.\n- **Output:** Go-style, and the exit status is 1 on any failure.\n- **Benchmarks** grow their iteration count the way Go's do and report ns/op.\n- **Examples** capture what the body prints and compare it with `outputs`.\n- **New runtime primitives**, added to every backend:\n  - a dynamic panic message, task-aware (so a failure ends only its test);\n  - exit with a status code;\n  - a monotonic clock, exposed as `Time.now_ns`;\n  - stdout capture.\n\n## Fixed on the way\n\n- **Value-less `if`/`else` in C:** an `if x = opt { f() } else { g() }` whose branches end in calls that return nothing used to generate invalid C. It now lowers to statements. The test-runner agent found it, and `syntax.alx` has a regression case.\n\n## Tests\n\n- `alx test` checks:\n  - a passing package (tests, examples, a benchmark, an imported helper package);\n  - a failing one (assert, `assert_eq` on Int and Str, an error, a panic, a wrong example, then a passing test), with exit 1;\n  - `-run`, `-bench`, `-benchtime`, `--release`;\n  - a misplaced `test` block.\n- `asserts.alx` checks assertion messages inside tasks on every backend.\n- Warning and `--strict` checks. The formatter check.\n- Acceptance: **153 of 153 checks pass.**\n\n## Not yet\n\n- **`alx test`:**\n  - Table-driven helpers and subtests (`t.Run`).\n  - Coverage, fuzzing and parallel tests.\n- **Warnings:** unused-result warnings for `~T` values (E4), and unused private defs.\n- **Formatter:** reflowing long lines (on purpose: line breaks are significant).\n"}, {"id": "r1", "title": "R1: Scoped regions", "group": "log", "md": "# R1: Scoped regions\n\nThe first step of the memory model (decision R1: regions by default, reference counts for what escapes). Until now nothing was ever freed. Now every function call and every loop iteration gets a region of its own, freed when it ends, and the compiler decides where each allocation lives. Nothing changes in the source code (R2: ownership is invisible).\n\n## What it buys\n\n| program (release build) | peak memory before | after | time before | after |\n|---|---|---|---|---|\n| `mem/calls.alx`: 20,000 calls that each build 50 strings | 685 MB | **1 MB** | 0.085 s | **0.043 s** |\n| `mem/loops.alx`: 600,000 loop iterations that build strings (`while`, `each`, `for`) | 78 MB | **2 MB** | | |\n\nThe calls program runs twice as fast because it touches far less memory. The acceptance suite's speed budgets all still hold.\n\n## How it works\n\n- **Three places an allocation can go:**\n  - **The call's frame region**, entered on the way in and freed on every way out: falling off the end, `return`, errors, and through `defer`.\n  - **The caller's region**, for anything that can become the result. The caller chooses which region is current at the call, so this is passing the destination region dynamically.\n  - **The program region** (never freed), for anything that can outlive both: whatever is stored into a parameter's storage, channels, tasks, generators, and unknown callees.\n- **Loop iterations.** `while`, `loop`, `each` and `for` bodies get an iteration region that is renewed every iteration, and also freed on `next`, `break` and `return`. Iteration regions are only used when something allocated inside can't be carried to a later iteration.\n  - A variable assigned in one iteration and read in the next keeps its value (`last = \"middle\"` in an `if`), so such values stay in the frame.\n- **Escape analysis** (`compiler/src/regions.rs`):\n  - Each function is a graph of locals, allocation sites, the result and the program region. Assignment is aliasing, which is symmetric: both names see what's stored through either. Storing a value into a container is one-way.\n  - Each site lives in the strongest place it can reach.\n  - Calls use the callee's summary (does parameter i reach the result, or something longer-lived?), solved to a fixpoint over the whole program, recursion included.\n  - Values with no storage (Ints, Bools) carry no aliases, except Ints in promote mode, which are bignums.\n  - Whatever the analysis doesn't understand is treated as escaping, so it can keep memory too long but can't free it early.\n- **Errors leaving a function** are deep-copied into the caller's region, since errors are rare.\n- **Top-level error messages** are built before the frame is freed.\n- **Runtime** (built by a Sonnet agent):\n  - A region is a list of 1 MB chunks plus large blocks. Switching regions swaps the existing inline bump pointer, so allocation stays a pointer bump.\n  - Freed chunks go to a per-thread free list (at most 4 MB kept).\n  - Under ASan, chunks are really freed, so any too-early free crashes the sanitizer row of the acceptance suite. That row caught two real bugs while this was being built: one-way aliasing, and bignums in promote mode.\n  - `ALX_MEMSTATS=1` prints peak and final memory. `ALX_NO_REGIONS=1` turns the analysis off for comparison.\n- **Rust oracle and wasm:** regions are no-ops. Rust owns its memory, and the browser runs short programs.\n\n## Tests\n\n- `regions.alx` exercises every way a value leaves a call:\n  - returned, nested in a struct, stored into a parameter or through a parameter's field;\n  - a view or element of an argument;\n  - an error, a value stored into a parameter map, a lambda capture, an array grown and returned;\n  - a channel and a task, and recursion.\n\n  It gives identical output on all backends and is ASan-clean.\n- Bounded-memory checks: `mem/calls.alx` and `mem/loops.alx` must peak at 8 MB or less.\n- Acceptance: **159 of 159 checks pass.** Every case's ASan row now runs with regions freeing for real.\n\n## Not yet (next milestones)\n\n- **R2:** values stored into long-lived places still go to the program region and stay there. This affects a map that lives for the whole program, a field of a parameter, or a value sent on a channel.\n- **R3** reference-counts those, so replacing `cache[k]` frees the old value.\n- **Lambdas, generators and task bodies** allocate in whatever region is current when they run. That's safe, but they don't free their own temporaries yet.\n"}, {"id": "r2", "title": "R2: Values stored into a caller's objects", "group": "log", "md": "# R2: Values stored into a caller's objects\n\nR1 put a function's temporaries in its own region and its result in the caller's. What a function *stores into its caller's objects* still went to the program region, never freed. That covers a helper adding to a map it was given, or a `!` method growing one of its receiver's fields. A caller that builds a container per loop iteration and lets a helper fill it leaked everything the helper stored.\n\n```ruby\ndef tally(m: Map[Str, Int], n: Int) {\n  (1..20).each { m[\"word #{it % 7} of #{n}\"] += 1 }\n}\nwhile i \u003c 20000 {\n  counts: Map[Str, Int] = {}\n  tally(counts, i)          # the keys tally makes now live where `counts` does\n  ...\n}\n```\n\n| `mem/fill.alx` (release) | peak memory |\n|---|---|\n| R1 | 20 MB, growing with the iteration count |\n| **R2** | **1 MB**, flat |\n\n## How it works\n\n- **A new place.** The escape analysis gives a value whose only long-lived destination is one parameter's storage (and nothing longer-lived) the place \"into parameter p\".\n- **Where such a value is allocated**, in order of preference:\n  1. At a store into a container (`\u003c\u003c`, `m[k] =`, `a[i] =`, field stores through `self`, `copy`), the region of the container's storage, looked up once for the store, its values and any growth.\n  2. Otherwise, the region of the parameter's own storage. This case is the key built in a temporary before `m[k] += 1` stores it.\n  3. If the parameter has no storage of its own (a struct passed by value), the program region, as before.\n- **The runtime query `region_of(pointer)`** (built by a Sonnet agent) answers in one hash probe: which of this thread's regions holds this address, interior pointers included.\n  - Chunks are now 1 MB-aligned, and every 1 MB granule of a chunk or large block is registered when it's acquired and removed when it's freed.\n  - Anything else (literals, stack, runtime buffers, other threads' memory, NULL) answers \"the program region\", which is always safe.\n\n## Also in this round (R4, started)\n\n- **Lambdas capture variables, not copies (R5, replacing D16).**\n  - A captured variable that changes after capture lives in a one-element slice cell. Slices share storage, so the lambda and the function see one variable: a counter works, closures keep state, and late binding sees the latest value.\n  - `spawn` bodies and generators still copy (task boundary).\n  - Test: `closures.alx`.\n- **`!` methods through interfaces (R7).**\n  - An interface can declare `def write!(s: Str) -\u003e Int`. Calling it on an interface value in a variable, field or element mutates the value in place, which is Go's pointer receivers as used by `io.Writer`.\n  - Dispatch hands each implementor's `!` method a cell of its own type, placed in the interface value's region, and writes it back.\n  - Test: `writers.alx`.\n\n## Tests\n\n- `mem/fill.alx` must stay at 8 MB or less.\n- `closures.alx` and `writers.alx` run on every backend, ASan included.\n- The `region_of` runtime test (`compiler/runtime/tests/region_test.c`) runs plain, under ASan and under TSan.\n- Acceptance: **168 of 168 checks pass.**\n\n## Not yet\n\n- **R3:** long-lived containers that churn still keep replaced values until the container's region dies. This affects a cache map in `main` or one that lives as long as a server.\n- **Interface methods:** `IfaceCall` is still treated as \"escapes\" by the analysis, so values passed to interface methods go to the program region.\n"}, {"id": "r3", "title": "R3: Containers that churn", "group": "log", "md": "# R3: Containers that churn\n\nAfter R1 and R2, a map or pool that lives across a loop kept every value it had ever held until the function returned. Replacing `cache[key]` or removing a pool entry dropped the reference, but the bytes stayed in the region. A cache in `main`, or one that lives as long as a server loop, grew without bound.\n\nDecision R11 (per-container regions with compaction, chosen over refcounting) fixes this for the common shape:\n\n```ruby\ncache: Map[Str, Str] = {}\nwhile i \u003c 300000 {\n  key = \"user#{i % 100}\"\n  cache[key] = \"report #{i} for #{key}\"   # replaces one of 100 entries\n  i += 1\n}\n```\n\n| release build, peak memory | before R3 | **R3** |\n|---|---|---|\n| `mem/churn.alx` (map, 300k replacements, 100 live) | 24 MB | **3 MB** |\n| `mem/pchurn.alx` (pool, 200k adds and removes, 50 live) | 20 MB | **3 MB** |\n\n## How it works\n\n- **Owners.** The region analysis (`compiler/src/regions.rs`, `owners`) picks the map or pool locals that:\n  - are made once, in the frame, and never reassigned;\n  - are mutated inside a loop, where the def isn't in that loop;\n  - don't escape: nothing connected to them reaches a return, a global or a caller.\n\n  Every other local tied to the container must also be either fresh each iteration or used only after the loop. A local used only after the loop counts only if the loop isn't nested in another loop.\n- **A child region per owner.** At its definition, the container's contents get a region of their own (`RegionNew`, a child of the frame). Everything stored into it is allocated there: keys, values, slot growth. The header records the region and its size after the last compaction.\n- **Compaction at the top of each iteration** (while/loop bodies, and after each `each` element):\n  - It runs when `region bytes \u003e 3 × live bytes + 64 KB`.\n  - The live contents are deep-copied into a fresh child region: a map is rebuilt from its entries, a pool's slot array is copied as-is.\n  - The old region is freed in one call.\n\n  The factor 3 keeps compaction from firing again on the very next iteration. The copied slot array has no spare capacity, so the next push doubles it.\n- **Cost:** deterministic and amortized. Each compaction copies the live set, and the next one waits until garbage is at least twice that size. No global GC, and no change to the layout of slices or strings.\n\n## Pools reuse slots\n\nA pool's slot array used to grow by one per `add` forever, so churn through a pool was unbounded no matter how its region was handled.\n\n- **Reuse.** Removed slots now go on a free list in the pool header, and `add` reuses them.\n- **Generational handles.** A handle is `slot index | generation \u003c\u003c 32`. A slot is live while its generation is odd. `remove` bumps it to even and `add` bumps it back to odd.\n- **Stale handles still panic.** A handle to a removed slot still fails with \"use of a removed pool handle\", even after the slot is reused. `remove` with a stale handle returns none.\n- **Printing** a handle shows only its index (`@3`), as before.\n\n## Bugs found on the way\n\n- **Push onto a non-empty subslice wrote past its end** (C runtime and JIT). D6 says a subslice has no spare capacity (cap 0), but push only grew when `len == cap`. Push now grows when `len \u003e= cap`. `collections.alx` gains a case.\n- **The Rust oracle had the same case wrong:** its new capacity underflowed when the slice was longer than 4.\n- **`pool.remove(h)` as a statement** failed to compile in C because the result tuple type was never declared. The result is now bound to a typed temp.\n- **Handles count as storage-free** in the escape analysis, so a list of handles no longer ties itself to the pool.\n\n## Tests\n\n- `mem/churn.alx` and `mem/pchurn.alx` are in the bounded-memory checks (8 MB or less).\n- Both run identically on the JIT, C debug, release and ASan builds and the Rust oracle.\n- Acceptance: **174 of 174 checks pass.**\n\n## Not yet\n\n- **A container passed to other functions.** A container that is a parameter, or that is stored into a struct field, isn't an owner. That covers a cache handed to a request handler, which is the server shape. That needs owners to cross calls, together with R6's sharing rules.\n- **Slice elements and struct fields that churn** (`xs[i] = new_string` in a long loop) still keep old values until the enclosing region dies.\n- **The 64 KB floor** means small containers are never compacted. That's intentional.\n"}, {"id": "r4", "title": "R4: Captures, receivers, pools", "group": "log", "md": "# R4: Captures, receivers, pools\n\nThree pieces of the memory model that change what you can write. They are decisions R5 (captures), R7 (pointer receivers) and R3 (graphs).\n\n## Lambdas capture variables (R5, replacing D16)\n\n```ruby\ncount = 0\ninc = -\u003e { count += 1 }\ninc(); inc(); inc()\nputs count                   # 3\n\ndef counter -\u003e (Int) -\u003e Int {\n  n = 0\n  -\u003e(by: Int) { n += by; n } # the lambda keeps `n`\n}\n```\n\n- **What gets converted:** a variable a lambda captures that changes after capture (reassigned, pushed to, indexed into) becomes a one-element slice cell, in a pass over the checked program (`compiler/src/capture.rs`).\n  - Slices share storage, so the function and every lambda see the same variable, and escaping lambdas keep it alive (the regions analysis sees the cell flow with the lambda).\n  - Variables that never change after capture are still copied, which is indistinguishable and cheaper.\n- **What still copies:** `spawn` bodies (a task boundary, so no data races) and generators.\n\n## `!` methods through interfaces (R7)\n\n```ruby\ninterface Writer {\n  def write!(s: Str) -\u003e Int\n  def written -\u003e Str\n}\nws: [Writer] = [Buffer.new, Counter.new]\nw.write!(\"hello\")            # mutates the value inside the interface\n```\n\n- **Declaration:** interfaces can declare `!` methods, and implementors provide them.\n- **Calls:** calling one on an interface value in a variable, field or element mutates it in place. This is Go's pointer receivers, which `io.Writer` and friends need.\n- **Dispatch:** the call hands the implementor's method a cell of its own type, in the interface value's region, and writes it back.\n\n## Pools and `@T` handles (R3)\n\n```ruby\nstruct Node {\n  key: Int\n  left: @Node?               # a handle, not the node: recursion is fine\n  right: @Node?\n}\nnodes = Pool[Node].new\nh = nodes.add(Node.new(key: 50))   # @Node\nnodes[h]                     # read (checked)\nnodes[h] = Node.new(...)     # write\nnodes.remove(h)              # Node? (leaves a tombstone)\nfor h, n in nodes { ... }    # live entries\n```\n\n- **Recursive types:** `@Node` names a type without containing it, so recursive and graph-shaped data can finally be declared.\n- **Representation:** a pool is shared like a map, and freed with whatever region holds it. A handle is a slot index.\n  - Reading a removed handle panics: \"use of a removed pool handle\".\n  - The value for `nodes[h] = ...` is computed before the pool is touched, because computing it may add to the same pool and move its storage. The C sanitizer caught this.\n- **Not yet:** compile-time branding, so that a handle can't be used with another pool of the same type.\n\n## Tests\n\n- `closures.alx`: a counter, closure state, a shared log, late binding.\n- `writers.alx`: an interface with a `!` method over two implementors, in a slice and in a variable.\n- `pools.alx`: a binary search tree, tombstones, iteration.\n- All of them are identical on the JIT, clang debug, release, ASan/UBSan and the Rust oracle.\n- Acceptance: **172 of 172 checks pass.**\n"}, {"id": "r5", "title": "R5: M:N tasks", "group": "log", "md": "# R5: M:N tasks\n\n`spawn` used to start an OS thread with an 8 MB stack. Tasks are now coroutines multiplexed over one worker thread per core. The compiler didn't change: `alx_spawn`, `alx_task_wait`, channels and `select` keep their C ABI, and the JIT reaches them through the same shims. Built by a Sonnet agent from a spec.\n\n| `mem/tasks.alx` (release): 100,000 tasks in a daisy chain | |\n|---|---|\n| Time | 0.67 s (JIT 1.0 s) |\n| Peak region memory | 1 MB |\n| RSS | 105 MB, about 1 KB per parked task |\n| Before R5 | 100,000 OS threads: not feasible |\n\n## Design\n\n- **Context switch:** hand-written assembly for aarch64 and x86_64, saving the callee-saved registers and stack pointer. No `ucontext`.\n- **Workers:** one per core (`ALX_PROCS` overrides), persistent, started at the first `spawn`. New tasks go on a global queue that any free worker takes from. A woken task goes on its worker's local queue.\n- **Stacks:** each worker has one 256 KiB run stack (`ALX_TASK_STACK` overrides) with a guard page. A task that parks copies its live part (typically about 1 KB) to the heap, and copies it back to the same addresses when it resumes. That's why 100,000 parked tasks cost about 100 MB.\n- **Sanitizer builds** give each task a private stack instead, because ASan's and TSan's shadow memory is per address. They annotate every switch for the sanitizer.\n- **Stack overflow:** a fault on the current task's guard page prints \"alexandrite: stack overflow in a task\".\n- **Waiting:**\n  - Each channel, each task (for `wait`) and each `Mutex` keeps a wait list, and a state change wakes only that list.\n  - A waiter re-checks its condition after waking, so the channel logic didn't change.\n  - Inside a task, waiting parks the coroutine. Main, which runs on its own OS stack, still blocks on a condvar.\n- **Deadlock detection:** a count of running, queued and unstarted tasks (main included). When it reaches zero, main reports \"all tasks are asleep: deadlock\". That now also covers deadlocks among tasks only, while main waits on one of them.\n- **Region state follows the task:** on a switch, the bump cache is flushed into the current region and the current region and task are saved, then restored on resume.\n\n## Tasks stay on one worker\n\nA task runs only on the worker that first ran it.\n\n- **Why:** at `-O2`, clang keeps the address of the thread-local bump pointer in a callee-saved register across calls, `alx_chan_recv` included (seen in the arm64 assembly). A task resumed on another thread would keep allocating through the old thread's bump cache.\n- **Cost:**\n  - A woken task waits for its own worker.\n  - A CPU-bound task that never blocks can starve the tasks queued behind it.\n  - There's no work stealing.\n- **The fix,** later: reach the allocator state through the current worker's structure (a register or a call clang can't cache) instead of C thread-locals. Migration and a global `region_of` registry would come with it.\n\n## Why this wasn't stdlib work\n\nThe scheduler is runtime: context switches, queues and parking. The I/O event loop is the part that needs the standard library. With it, a socket read parks the task instead of blocking its worker. It comes with `net` in L3. Until then, a blocking system call blocks its worker.\n\n## Tests\n\n- `mem/tasks.alx` (R5 checks): the release build's output and its region and RSS bounds, plus the JIT.\n- `compiler/runtime/tests/tasks_test.c` passes plain, under ASan and under TSan, with 1 and 3 workers. It covers:\n  - the 100,000-task chain;\n  - tasks that park while inside regions;\n  - stack overflow;\n  - deadlock.\n- `concurrency.alx` and `concurrency.deadlock.alx` are unchanged on every backend.\n- `sync.alx` (R6's `Mutex`) runs on the new wait lists.\n- Acceptance: **193 of 193 checks pass.**\n\n## Not yet\n\n- Task migration, work stealing, and a global `region_of` registry (see above).\n- **One global lock** guards every channel and queue. The chain is faster with 1 worker (about 40 ms) than with 11 (about 450 ms), because every hop is a cross-worker wake through that lock. Scheduling and locking are the next target.\n- **The I/O event loop** comes with `net` (L3).\n"}, {"id": "r6", "title": "R6: Sharing", "group": "log", "md": "# R6: Sharing\n\nDecision R4: tasks share mutable state only through channels, `Mutex[T]` and `Atomic[T]`. Unsynchronized sharing is a compile error, not a data race.\n\n## Moves into tasks\n\nA slice, a map, a pool, a closure, or anything holding one has storage another task could change. Once such a value goes into `spawn`, down a channel or into a `Mutex`, it belongs to the other side. Using it afterwards is an error, and so is using anything that shares its storage.\n\n```ruby\nresults: [Int] = []\nt = spawn { results \u003c\u003c 1 }\nresults \u003c\u003c 2        # error: `results` was moved into a task at 2:5, so the\n                    # other task owns it now; using it here would share it\n                    # without synchronization\n```\n\n| Pattern | Verdict |\n|---|---|\n| A fresh value per iteration (`part = [w, w * 2]; spawn { part.sum }`) | fine |\n| A copy handed over (`copy = data.dup; spawn { copy.sum }; data \u003c\u003c 4`) | fine |\n| Sent, then reassigned (`ch \u003c\u003c buf; buf = [2]`) | fine |\n| A task's result taken back with `wait` | fine: it's ours again |\n| A subslice of something sent (`view = data[1..]; ch \u003c\u003c data; view[0]`) | error: `view` shares storage with `data` |\n| The same slice captured on every loop iteration | error: each task would share it with the one before |\n| A parameter handed to a task | error: it's the caller's storage; hand over `.dup` |\n\n- **How it's checked** (`compiler/src/sharing.rs`): what shares storage comes from the region analysis's alias graph, in both directions, stopping at returns, globals, callers and mutexes. \"Afterwards\" is flow-sensitive:\n  - branches merge;\n  - loops and blocks run to a fixpoint (a block may run any number of times);\n  - `break` and `next` carry their state to the right place;\n  - assigning a variable again gives it fresh storage.\n- **Graph fixes:**\n  - a `Task` handle no longer aliases its captures;\n  - a flat `.dup` (elements without storage) is fresh storage.\n\n## Mutex[T]\n\n```ruby\nstats = Mutex.new(Stats.new(hits: 0, names: []))\nspawn {\n  stats.lock { |s|\n    s.hits += 1\n    s.names \u003c\u003c \"w#{w}\"\n  }\n}\ntotal = stats.lock { |s| s.hits }       # the block's value is copied out\n```\n\n- **`lock` runs the block holding the lock.** The block gets the value; changes to it, reassignment included, are written back when the block ends.\n- **Leaving early is a compile error,** since it would keep the lock held. That covers `return`, `~`, `fail`, and `break`/`next` out of the block (loops inside it are fine).\n- **Nothing outside the block may keep a reference into the guarded value** (`keep = xs` is an error). The block's value is deep-copied out instead.\n- **`Mutex.new(v)` moves `v` in.** Using `v` afterwards is the same error as for tasks.\n- **A lock is a scheduler wait like a full channel,** so a self-deadlock reports \"all tasks are asleep: deadlock\".\n\n## Atomic[T]\n\n`Atomic.new(0)` or `Atomic.new(false)`, with `load`, `store(v)`, `add(n)` (Int; gives the new value), `swap(v)` (gives the old value) and `compare_and_swap(old, new)`. All are sequentially consistent. Anything else goes in a `Mutex`.\n\n## Backends\n\n| Backend | Lock | Atomics |\n|---|---|---|\n| C | runtime `alx_lock`/`alx_unlock` | `__atomic` builtins |\n| JIT | through shims | Cranelift `atomic_*` instructions |\n| Rust oracle | `Mutex\u003cbool\u003e` + `Condvar` | `AtomicI64` |\n| Browser | refused, with tasks and channels | refused |\n\nNew LIR: `LTy::Lock`/`Atomic`, `LockNew`, `Lock`/`Unlock`, `AtomicNew`/`Load`/`Store`/`Rmw`/`Cas`.\n\n## Tests\n\n- `sharing.alx` and `sync.alx` run on every backend, ASan included.\n- Eight negative cases (`sharing.bad1-4`, `sync.bad1-4`).\n- Acceptance: **190 of 190 checks pass.**\n\n## Not yet\n\n- **Read-only sharing.** Workers reading one big slice must each get a `.dup`. A frozen, immutable share is the likely fix.\n- **`.dup` is shallow.** Nested slices inside a dup still share, and the check doesn't see it.\n- **Unbounded growth.** What a task stores under a lock lives in the program region and isn't compacted. The R3 compaction could apply at unlock.\n- **Locking cost.** Locks go through the scheduler's single lock: correct, not fast.\n"}, {"id": "r7", "title": "R7: Explain", "group": "log", "md": "# R7: Explain\n\nDecision R8: memory placement stays silent, and `alx explain mem` shows it on demand. It lists every allocation site of the program, the region the value lives in, and why.\n\n```\n$ alx explain mem explain.alx\n(top level)  explain.alx\n  2:14    []                                 frame: freed when the program ends\n  6:10    \"line #{i}\"                        frame: freed when the program ends  \u003c\u003c every iteration: piles up until then\n  7:3     cache[i % 10] = \"value #{i}\"       `cache`'s own region: compacted at the loop at 5:7\n  7:19    \"value #{i}\"                       `cache`'s own region: compacted at the loop at 5:7\n  9:5     log \u003c\u003c line                        frame: freed when the program ends  \u003c\u003c every iteration: piles up until then\n  11:7    spawn { \"task #{i}\" }              iteration of the loop at 5:7: freed each time round\n  11:15   \"task #{i}\"                        program region, never freed: it reaches `spawn { \"task #{i}\" }` at 11:7  \u003c\u003c every iteration: grows without bound\n  12:8    t.wait.unwrap                      iteration of the loop at 5:7: freed each time round\n\n1 allocation site(s) in the program region; 3 site(s) inside loops that pile up\n```\n\n## What it says\n\n| Place | Meaning |\n|---|---|\n| **frame** | freed when the function returns |\n| **iteration of the loop at L:C** | freed every time round (R1) |\n| **the caller's region** | it's the result (R1) |\n| **the region of `p`** | stored into a parameter's storage (R2) |\n| **`c`'s own region** | an owning container, compacted at the loop (R3) |\n| **program region, never freed** | with the expression that sent it there: a `spawn`, a channel send, a global, or a function that keeps it |\n\nThe \"every iteration\" marks are the old plan's hot-loop lint, without refcounts. A site inside a loop whose value lives in the frame or the program region accumulates: until the function returns, or forever. The marks list exactly those sites.\n\n## How\n\n- **Reasons.** The region analysis now records, for each node it sends to the program region, the expression responsible. The explainer walks from an allocation site to the first node with a reason.\n- **Loop positions** are recorded in the analysis too: a `while`'s condition, or the iterating call.\n- **No new analysis.** The explainer reuses the placement the compiler computes for lowering, so what it prints is what the program does.\n- **Fewer phantom sites.** Values without storage (Ints, atomics, Unit) aren't listed, except stores, whose growth allocates.\n\n## Tests\n\n- An R7 acceptance check runs `alx explain mem` on `mem/explain.alx` and checks the four kinds of answer and the summary line.\n- Acceptance: **191 of 191 checks pass.**\n\n## Not yet\n\n- **Program-region reasons through calls.** A function that keeps its argument shows \"it reaches `f(x)` at L:C\", not the store inside `f`.\n- **Opt-in warnings.** No lint mode turns the marks into warnings (`--strict` could).\n"}, {"id": "l1", "title": "L1: Text \u0026 data core", "group": "log", "md": "# L1: Text \u0026 data core\n\nThe first wave of Go's standard library (decision S1). The packages are written in alexandrite, embedded in the compiler, and imported by Go's paths (`import \"strings\"`). The API shape is decision S2:\n\n- Go's names in snake_case.\n- `~T` where Go returns (T, error).\n- `T?` where Go returns (T, bool).\n- Tuples where Go returns two values.\n- Every function whose first parameter takes a type is also a method on it: `s.has_prefix(\"x\")`, `xs.index_func { it \u003e 2 }`.\n\n| Package | Functions | Tests | Notes |\n|---|---|---|---|\n| `fmt` | 7 builtins | `fmt.alx` | `sprintf`/`printf`/`sprint`/`sprintln`/`print`/`println`/`errorf`. Verbs `%v %d %s %q %t %f %e %x %o %b %c %T` with flags, width and precision, checked against the arguments at compile time |\n| `strings` | 54 | 31 | Builder; case mapping for Latin, Greek and Cyrillic |\n| `strconv` | 37 | 24 + Go-generated vectors | `parse_float` correctly rounded (Clinger fast path, plus a port of Go's multiprecision slow path); shortest `format_float`; Go's quoting |\n| `unicode` | 17 | 22 | Full Unicode 17.0 tables generated from Go's, checked over every code point |\n| `unicode/utf8` | 16 | 14 | Invalid input decodes to (RUNE_ERROR, 1), as in Go |\n| `bytes` | 68 | 30 | `strings` for `[Byte]`, plus Buffer; Go's aliasing rules |\n| `slices` | 31 | 22 | introsort (faster than the builtin sort: 63 ms vs 83 ms for 10⁶ Ints), stable merge sort, `binary_search → (Int, Bool)` |\n| `sort` | 13 | 6 | |\n| `maps` | 8 | 6 | Keys in insertion order |\n| `math` | 56 | 15 | 37 libm functions through one LIR intrinsic in every backend, the browser included; Go's special cases |\n| `errors` | 1 | 2 | `new`; Go's `Is`/`As`/`Wrap` map onto `case` and `wrap` |\n\nBuilt by six Sonnet agents in parallel worktrees, each from a spec. Their gap reports drove the language work below.\n\n## The language, grown to fit\n\n- **Tuples:**\n  - `(A, B)` and `(A, B)?` types, `(a, b)` literals and `return a, b`;\n  - `a, b = pair`, with `_` skipping an element, and `t[0]`;\n  - element-wise coercion (`(1, \"a\")` as `(U8, Str)`).\n- **Functions as values:**\n  - a named function where a function is wanted (`sort_func(xs, by_len)`);\n  - a block for a last parameter of function type, also through method sugar (`xs.index_func { it \u003e 2 }`).\n- **Parallel assignment to places:** `a[i], a[j] = a[j], a[i]`.\n- **`panic(msg)`, `assert cond, \"why\"`, and Go's string escapes** (`\\xHH \\uHHHH \\UHHHHHHHH \\a \\b \\f \\v \\r`). Unknown escapes are errors.\n- **Constants:**\n  - folded Int constants stay exact until typed (`v: U64 = 1 \u003c\u003c 63`);\n  - an untyped constant in a ternary takes the other branch's type.\n- **`Str#split` is Go's `strings.Split`:** empty fields are kept, and an empty separator splits into UTF-8 sequences.\n- **`Unit` is a type name.**\n- **Fixes:**\n  - a function ending in an `if` whose branches all return (JIT verifier);\n  - `Array#reverse` was miscompiled and is removed (`slices.reverse` reverses in place);\n  - separate-compilation headers handle sized integers;\n  - `alx fmt` keeps `~(A, B)\u003cE\u003e` tight.\n\n## The std plumbing\n\n- **Embedding:** `std/` is embedded by `compiler/build.rs`. A std package resolves when the module has no directory of that name.\n- **Method sugar:** it applies after a type's own methods, and checks the receiver's outer shape for generic first parameters.\n- **Tests:** the acceptance harness runs every package's tests on the JIT and in release builds.\n\n## Tests\n\n- Every std package's tests pass on the JIT and in release builds: 172 test blocks, plus thousands of generated assertions.\n- New acceptance cases: `fmt`, `tuples`, `funcvalues` and `math`.\n- Acceptance: **223 of 223 checks pass.**\n\n## Not yet\n\n- **Slices have no `==`** (as in Go); use `slices.equal`.\n- **Top-level constants** are scalars or one string literal, so tables are encoded in strings.\n- **No method sugar inside a package's own code or tests.**\n- **`strconv.parse_float` is slow on inputs off its fast path:** microseconds to tens of microseconds each (no Eisel–Lemire yet).\n- **Case mapping** in `strings` covers Latin, Greek and Cyrillic; `unicode.to_upper` covers everything, one rune at a time.\n"}, {"id": "l2", "title": "L2: Systems core", "group": "log", "md": "# L2: Systems core\n\nThe second wave of Go's standard library: files, streams, processes, clocks and command lines. It sits on a new C foreign-function interface, so the packages are alexandrite code over libc, as Go's are over `syscall`.\n\n| Package | Functions | Tests | Notes |\n|---|---|---|---|\n| `os` | 70 | 12 | files, directories, links, stat, environment, process; `FsError` with messages like Go's (`open /x: no such file or directory`) |\n| `io` | 38 | 9 | `Reader`, `Writer`, `Closer`, `Seeker` and their combinations; `copy`, `read_all`, `read_full`, `write_all`; EOF is `0` (F3) |\n| `bufio` | 38 | 17 | buffered `Reader`/`Writer`; `Scanner` over lines, words, runes or bytes |\n| `time` | 96 | 46 + ~1,700 assertions generated from Go | `Duration`, `Time`, Go's layouts for `format`/`parse`, monotonic `sub`; `sleep`, `after`, `tick`, `Timer`, `Ticker`; tested under five time zones |\n| `flag` | 34 | 10 | Go's parsing rules; a `FlagSet` holds the values (there are no pointers); `-h` fails with the usage text |\n| `path`, `path/filepath` | 24 | 11 | Go's `clean`, `join`, `split`, `match`, `rel`; `abs`, `glob`, `walk_dir` |\n\nBuilt by four Sonnet agents in parallel worktrees, after the FFI (also an agent). An example, `acceptance/cases/wc.alx`, counts the words of its own source through `os` and `bufio`.\n\n## The C FFI\n\n```ruby\nextern def write(fd: I32, buf: [Byte], n: Int) -\u003e Int\nextern def getenv(name: Str) -\u003e Ptr\nhome = Str.from_cstr(getenv(\"HOME\"))\nfail \"close: #{C.strerror(C.errno)}\" if close(fd) \u003c 0\n```\n\n- **Parameters:** sized integers, Float, Bool, `Ptr` (opaque), `Str` (a NUL-terminated copy made for the call) and `[Byte]` (a pointer to the first element).\n- **Returns:** scalars, `Ptr` or nothing.\n- **Strings back from C:** `Str.from_cstr` / `Str.from_ptr`.\n- **errno:** `C.errno` is saved right after each call.\n- **Purity:** calling C is I/O, so `fn` and `#[pure]` defs can't.\n- **Per backend:**\n  - C: a private name bound to the real symbol with `__asm__`, so it can't clash with system headers;\n  - JIT: `dlsym`, with C's exact argument widths;\n  - Rust oracle: `extern \"C\"` blocks;\n  - browser: refuses.\n- **Variadic functions** (`open`, `fcntl`) go through small runtime shims. `alx_sys_const(\"O_CREAT\")` gives the platform's constants.\n\n## Runtime additions\n\n- **Sleeping parks the task:** `alx_sleep_ns` puts it on a timer list served by one timer thread, so its worker runs other tasks. 200 tasks sleeping 50 ms finish in 55 ms on one worker. Sleepers don't count as a deadlock.\n- **Program arguments:** `alx run file.alx a b` (or `-- a b`) passes the arguments on, and native binaries read them from `main`.\n- **Clocks** (wall, monotonic, local offset and zone) and **shims** for `stat`, directory reading and `environ`.\n\n## The language and compiler, grown to fit\n\n- **Fallible interface methods:**\n  - `def read!(p: [Byte]) -\u003e ~Int` in an interface, called as `r.~read!(p)`;\n  - an implementor that can't fail satisfies one;\n  - `~` on a direct `!` call propagates after the receiver is written back.\n- **Interface calls in the region analysis** now use the implementors' summaries, instead of sending everything to the program region: 1.25 GB down to 213 MB on a 2-million-call loop.\n- **Name resolution:**\n  - a bare field read wins over a global function of the same name;\n  - inside a struct, a method of `self` wins only when its arity fits.\n- **`File` and `Time` are no longer reserved names.**\n\n## Tests\n\n- Every package's tests pass on the JIT and in release builds.\n- New acceptance cases: `ffi` (plus 3 negative cases), `flags` and `wc`.\n- Acceptance: **299 of 299 checks pass.**\n\n## Not yet\n\n- **Blocking I/O:** a read on a pipe, a tty or (later) a socket blocks its worker thread. The I/O event loop is L3.\n- **Struct copies (solved for the std types, GO-VS-RUBY D36):** `bytes.Buffer`, `strings.Builder`, `bufio.Reader`/`Writer`/`Scanner`, `flag.FlagSet` and `os.File` keep their mutable state in a one-element slice, so copies share it: `io.copy(buf, file)` fills the caller's `buf`, and a `bufio.Reader` passed to a helper that reads a line leaves the caller continuing after it. Remaining caveat: a zero-value `Buffer.new` has no state until its first write, so copies taken before that don't share; use `bytes.new_buffer`. User-defined readers/writers with plain mutable fields still advance only in the copy.\n- **Fixed after the first cut:**\n  - a fallible call under `~` is now made in the region its result is placed in;\n  - a `!` call reuses one receiver cell per call site, made empty at function entry (1M calls: 33 MB down to 2 MB peak);\n  - a struct holding its own interface is a clear error suggesting a generic struct (`Lim[T] { inner: T }`, like Rust's `BufReader\u003cR\u003e`);\n  - type-parameter bounds may name another package's interface (`[T: io.Reader]`);\n  - the Rust oracle emits tuple structs for tuples wider than 12;\n  - `loop` with no `break` is Never;\n  - arrays have `join`.\n- **Name resolution in tests:** importing `bytes` from a test of package `io` makes bytes' builtin `copy` resolve to `io.copy`, so the io-with-Buffer tests live in `std/os`.\n- **Platform:** no time-zone database (UTC, Local and fixed zones only). Linux is untested.\n"}, {"id": "l3", "title": "L3: Server core", "group": "log", "md": "# L3: Server core\n\nThe third wave, and the last milestone on the roadmap: what a Go-style network service needs. It comes in two layers:\n\n- **Runtime:** an I/O event loop under the M:N scheduler (S4), so a socket read parks the task, not its thread.\n- **Std packages in alexandrite:** `net`, `net/http`, `encoding/json` over compile-time derives (S3), `context` and `sync`.\n\n```ruby\nimport \"net/http\"\nimport \"encoding/json\"\n\n#[derive(Json)]\nstruct Greeting {\n  to: Str\n  #[json(omit_empty)] tags: [Str]\n}\n\ndef hello(w: http.ResponseWriter, r: http.Request) -\u003e Unit {\n  g = Greeting.new(to: r.path_value(\"name\") || \"world\", tags: [])\n  w.header.set(\"Content-Type\", \"application/json\")\n  w.write_string!(g.to_json.unwrap)\n}\n\nmux = http.new_serve_mux\nmux.handle_func(\"GET /hello/{name}\", hello)\nhttp.listen_and_serve(\":8080\", mux)\n```\n\n| Package | Tests | Notes |\n|---|---|---|\n| `net` | 12 | `listen`, `accept`, `dial`; `Conn` is an io.Reader/Writer/Closer; `NetError` messages like Go's (`dial tcp 127.0.0.1:1: connect: connection refused`) |\n| `net/http` | server, client, mux suites | Go 1.22 patterns (`\"GET /items/{id}\"`, `/static/`, `{$}`, 405 with `Allow`); HTTP/1.1 keep-alive; Content-Length or chunked; a client with `get`/`post`/`do` |\n| `encoding/json` | package suite + 3 negative cases | `#[derive(Json)]`: `to_json`, `to_json_indent`, `T.from_json`; field options `#[json(\"key\")]`, `omit_empty`, `skip`; enums externally tagged (serde's form); a dynamic `Value`; errors with byte offsets |\n| `context` | 5 | `background`, `with_cancel`, `with_deadline`, `with_timeout`; a derived context watches its parent with a small task |\n| `sync` | 3 | `WaitGroup`, `Once`, `Lock` over the language's `Mutex`, `Atomic` and channels |\n\n## The event loop\n\n- **The poller:** one poller thread runs kqueue on macOS (epoll on Linux, untested).\n- **`alx_fd_wait(fd, mode)`:** a task registers interest one-shot and parks. A plain thread (main) blocks in `poll(2)` instead.\n- **Deadlock detection:** a task waiting on a socket counts like a sleeper, not as a deadlock.\n- **Socket shims:** they make every descriptor non-blocking and close-on-exec. `net`'s reads, writes, accepts and connects wait on `EAGAIN` and retry.\n- **Shared descriptors:** `Conn` and `Listener` hold their descriptor in an `Atomic[Int]`. Copies share it, and under R6 tasks may share a connection (one reads or accepts while another closes, as in Go). A close wakes the parked tasks, which then fail with `Closed`.\n\n| Measured (release, macOS) | |\n|---|---|\n| 50-client echo example (`echo.alx`) | the same output on the JIT, C debug/release/ASan and the Rust oracle |\n| `httpbench.alx`: 50 keep-alive clients × 200 requests, client and server in one process | ~46,000 requests/s, 125 MB RSS |\n| 10,000 idle connections (10,000 parked tasks + 20,000 sockets) | 454 MB RSS, ~45 KB per connection (see below) |\n\n## Derives\n\n`#[derive(Json)]` (details: `docs/notes/json-derive.md`) before a `struct` or `enum` is expanded by the parser into ordinary `def`s inside the type (`compiler/src/derive.rs`). Every backend therefore runs it unchanged, the browser included. The derived code is built on a small protocol (`json_enc`, `json_dec`, `json_zero`), which a hand-written type can implement instead. Unsupported field types fail at the derive with a message.\n\n## Language and runtime fixes found on the way\n\n- **Defers:** a function with a `defer` of a `!` call (one of two `defer`s) freed its frame region twice. The deferred code's own scope looked like leaving the function, so the frame was freed under a later frame that reused it. Found under ASan in `net/http`'s connection loop.\n- **The Rust oracle's socket wait** now polls in slices: on macOS, closing a descriptor in another thread doesn't wake a `poll` on it.\n- **A lambda's last call:** a lambda whose body is a single call returning Unit compiled to nothing. That broke every `-\u003e() { cancel(c) }`; it now runs.\n- **Fallible calls under `~`:** a call under `~` is made in its placed region. A result returned through two fallible calls was freed with the frame.\n- **Polling tasks yield:** `select ... else` lets the tasks queued on its worker run, adopting a task that hasn't started if need be. Before, a polling task starved them, because tasks are pinned to their worker.\n- **Sharing checks:** an alias walk stops at values without shared storage, and the lock-escape check only counts outer variables the block writes. Both had been false positives.\n- **Smaller fixes:**\n  - blocks for a struct method's function parameter;\n  - a discarded tuple in C;\n  - `loop` with no `break` is Never;\n  - `Array#join`;\n  - a struct holding its own interface is a clear error (use a generic struct, like Rust's `BufReader\u003cR\u003e`);\n  - bounds can name another package's interface;\n  - Rust-oracle tuples wider than 12;\n  - `!` calls reuse one receiver cell per call site (33 MB → 2 MB over 1M calls).\n\n## Not yet\n\n- **Memory per connection:** about 45 KB per parked connection task. Each task's regions touch whole 16 KB pages of their 1 MB chunks. A small first chunk per region would bring it toward Go's ~8 KB.\n- **Preemption:** a task in a tight loop that never calls into the runtime starves the other tasks pinned to its worker. Polling `select` yields, but plain loops don't. Go preempts asynchronously.\n- **Tasks stay on one worker** (R5): there's no work stealing and no migration.\n- **Missing features:**\n  - read/write deadlines and timeouts on connections;\n  - UDP and Unix sockets;\n  - TLS (crypto is a later wave);\n  - HTTP/2;\n  - `json` streaming (`Decoder` over a reader).\n- **Platform:** `getaddrinfo` blocks its worker. Linux paths are untested. macOS caps the listen backlog at 128 (`kern.ipc.somaxconn`), so a burst of 10,000 connects pays SYN retries.\n- **The agents:** three of this milestone's agents stalled (netpoll, json, http). I finished their work from checkpoints. The last `net/http` refactor checkpoint was dropped, and the merged version is the agent's last tested commit.\n"}, {"id": "t1", "title": "T1: Scripting", "group": "log", "md": "# T1: Scripting\n\nShell scripts and the repository's Python tooling, in alexandrite. Three pieces:\n\n- **Command literals:** backticks build a command; alx parses it, no `/bin/sh`.\n- **`os/exec`:** Go's package, plus pipelines, redirects and measurements.\n- **`sh`:** files, globs, directories, environment, script conveniences.\n\nThe acceptance harness, the benchmark runner, the doc-site builder and the sort-kernel generator are now alx programs. Python is gone from the repository outside `probes/` (historical experiments).\n\n```ruby\nimport \"sh\"\n\nfor f in sh.~glob(\"src/**/*.c\") {\n  `cc -O2 -c #{f} -o build/#{path.base(f)}.o`.~run   # f with spaces is one argument\n}\nn = `grep -c TODO #{*sh.~glob(\"src/**/*.c\")} | wc -l`.~output\n`make 2\u003e\u00261 \u003e build.log`.~run                          # redirects, left to right\nsh.in_dir(\"build\") { `tar czf out.tgz .`.~run }       # back to where we were after\nsh.parallel(sh.~glob(\"img/*.png\"), 8) { |f| `optipng -quiet #{f}`.~run }\nst = `./server --selftest`.~capture.state              # exit code, CPU time, peak RSS\n```\n\n## Command literals\n\n- **Words:** split on blanks.\n  - `'...'` is literal.\n  - `\"...\"` takes `\\\" \\\\ \\` \\$` escapes and `#{}`.\n  - `\\c` outside quotes is `c`.\n- **Interpolation:**\n  - `#{x}` is part of one argument, never split or re-parsed, so there is no quoting to get wrong and no injection.\n  - `#{*xs}` splices a `[Str]` as separate arguments.\n- **Operators:** `|`, `\u003c`, `\u003e`, `\u003e\u003e`, `2\u003e`, `2\u003e\u003e`, `\u0026\u003e`, `2\u003e\u00261`, `\u003e\u00262`. Applied left to right, as in sh: `2\u003e\u00261 \u003e f` sends stderr to the old stdout.\n- **What isn't there is an error,** with a hint:\n  - globs (`*` `?` `[`): use `sh.glob`;\n  - variables (`$`): interpolate;\n  - `\u0026\u0026` `||` `;`: use the language's control flow;\n  - `\u0026`: use a task;\n  - subshells.\n- **Desugaring:** the literal becomes `os/exec.from_literal(groups, kinds)`, a `Cmd` value. The file gets a hidden `import \"os/exec\"`.\n- **Running it:** nothing runs until `.~run` / `.~output` / `.~capture` / `.~exec`. A literal's `run` shows the command's output (`passthrough`); Go's `Run` discards it.\n- **Failure:**\n  - A nonzero exit is an `ExecError.Exit`, carrying the command line, the status and the stderr text (like `set -e`).\n  - `ALX_EXEC_NOFAIL=1` in the environment, or `c.check = false`, makes it return the status instead.\n  - Pipelines fail if any stage fails (`pipefail`), except an earlier stage killed by SIGPIPE (`yes | head`).\n\n## `os/exec`\n\n- **Go's API:** `command(name, args)`, `run`, `output`, `combined_output`, `look_path`, `ProcessState`, `ExitError`. `Cmd` is a value: fields `dir`, `env` (none = inherit), `stdin` (text).\n- **Additions:**\n  - `capture`: stdout, stderr and the state, without failing on a nonzero exit.\n  - `pipe(other)`.\n  - `exec`: replaces the process (Go's `syscall.Exec`).\n  - Each `ProcessState` has `user_ns` / `sys_ns`, `max_rss` (peak resident bytes, from `wait4`) and `wall_ns`.\n- **Runtime:**\n  - New shims: `alx_sys_spawn` (posix_spawnp with dup2 and chdir), `alx_sys_wait` (wait4 + rusage), `alx_sys_pipe`, `alx_sys_poll2`, `alx_sys_exec`. All backends have them: the C runtime, the JIT symbol table, and the Rust oracle through `std::process`.\n  - stdout and stderr are drained together, so large outputs on both don't deadlock.\n  - `stdin` text is written by a task, so any size works.\n- **A relative program path with a slash** (`.alx-cache/x-rel`) is relative to `dir`, as in Go.\n\n## `sh`\n\n| Area | Functions |\n|---|---|\n| Files | `read`, `read_lines`, `write`, `append`, `exists?`, `dir?`, `file?`, `mkdir_p`, `rm`, `rm_f`, `rm_rf`, `touch`, `ln_s`, `chmod`, `cp` and `cp_r` (into a directory if the target is one), `mv` (copy + remove across file systems) |\n| Finding | `glob` (`**` = any depth; `*` skips dot files unless the pattern starts with `.`), `walk` |\n| Directories and environment | `pwd`, `cd`, `in_dir(dir) { }`, `with_env([\"K=v\"]) { }` (both restore, also on failure), `env(k, default)`, `which`, `home` |\n| Scripts | `args`, `stdin_text`, `stdin_lines`, `lines_of`, `warn`, `abort` (Ruby's), `exit`, `timed { }` (a Duration), `parallel(xs, limit) { |x| ... }` (tasks; first failure by element order), `red`/`green`/`yellow`/`blue`/`bold`/`dim` (only on a terminal, not with `NO_COLOR`) |\n\n## Language changes it needed\n\n- **Fallible lambdas and blocks.** A lambda of type `(..) -\u003e ~T` may use `~` and `fail`, like a fallible def. A block passed to such a parameter is one: `sh.in_dir(\"x\") { `make`.~run }`. Before this, `~` inside any lambda was an error.\n- **`[T] + [T]`** concatenates into a new slice (Ruby's `Array#+`, Go's `append(a, b...)`).\n- **`f.dup` on a function value** copies its captures deeply, so it can go to a task (the sharing checker suggested it, but it didn't exist).\n- **Fixed: pushes inside lambdas were lost when the variable was declared with a type.** `out: [Str] = []` followed by `twice { out \u003c\u003c x }` left `out` empty: typed declarations weren't marked as user variables, so captures-by-reference (R5) skipped them. They also warn when unused now, like other locals.\n\n## Tooling ported\n\n| Was | Now | Checked |\n|---|---|---|\n| `acceptance/run.py` | `alx run acceptance/run.alx [-k FILTER]` | the full suite, every check from the Python version plus T1's |\n| `acceptance/bench.py` | `alx run acceptance/bench.alx`, plus `--mem` (peak RSS) | same columns; times within noise of the Python runner (it measures with `wait4` in-process) |\n| `docs/site/build.py` | `alx run docs/site/build.alx` | identical embedded data |\n| `std/slices/gen_sort.py` | `alx run tools/gen_sort.alx` | identical kernels (header line aside) |\n\n## Acceptance\n\n- `scripting.alx` (group T1) covers the whole surface, on every backend (JIT, release, ASan, Rust oracle). Its negative cases: a glob in a literal, and `~` in a block whose function type isn't fallible.\n- Package tests: `std/os/exec` and `std/sh`.\n\n## First memory comparison\n\n`bench.alx --mem` reports each runner's peak resident set (from `wait4`).\n\n- **Project Euler cases:** alx release has the smallest peak everywhere (about 1.2 MiB, against Go's 3.8 and Ruby's 14), except pe014 (16.8 vs Go 12.5: two million-element arrays where Go keeps one).\n- **Three allocation-heavy cases added for this** (with Go and Ruby ports; not yet in the harness's check groups):\n\n| case | alx-run | alx-rel | Go | Ruby | Ruby YJIT | time alx-rel / Go |\n|---|---|---|---|---|---|---|\n| `bintrees` (pools, depth 14) | 20.0 | 15.0 | 10.5 | 16.7 | 17.2 | 132 / 30 ms |\n| `strchurn` (200k lines, join, split) | 87.5 | 82.8 | 27.6 | 67.4 | 64.8 | 54 / 40 ms |\n| `wordfreq` (1M words, Map) | 60.0 | 52.4 | 8.7 | 18.8 | 19.4 | 131 / 34 ms |\n\n(peak MiB)\n\nWhat `alx explain mem` says:\n\n- **wordfreq:** passing `pairs` to `slices.sort_func` with a block sends everything that reaches it to the program region: the map, and through it every `word(...)` string built in the 1M-iteration loop. Every word ever made stays alive.\n- **strchurn:** `line.split(\" \")` in the inner loop piles up in the frame instead of being freed each iteration. (`split`'s pieces share the original, as in Go.)\n- **bintrees:** closest to Go. The stretch tree stays until the program ends, and pools grow by doubling.\n\n## Speed pass on the allocation-heavy cases\n\nRelease builds, ms (Go prebuilt alongside):\n\n| case | before | after | Go | peak MiB after (Go) |\n|---|---|---|---|---|\n| `bintrees` | 132 | 23.6 | 25.9 | 15.2 (10.8) |\n| `strchurn` | 54 | 18.9 | 37.0 | 82.8 (36.6) |\n| `wordfreq` | 131 | 37.6 | 32.0 | 5.7 (9.4) |\n\nProject Euler and nbody are unchanged or faster. `alx run` (JIT) keeps out-of-line calls for region switches, so it gains less (wordfreq 85 ms).\n\n### Regions\n- **Idle regions aren't made.** A post-pass over the LIR follows which region is current through every enter, use and restore, and drops a call's frame or a loop's iteration region if nothing can allocate while it's current. `make` and `check` in bintrees no longer enter a region per call.\n- **Idle switches are dropped.** A region switch around code that allocates nothing (a value built in place) goes away.\n- **Cheaper iteration regions.** An iteration region is a mark and reset on the region current at the loop (as light frames are for calls) when, while it's open, nothing allocates into another existing region and no call could store through its arguments. Otherwise its enter and exit are inline in the common case: a pooled region struct that kept its one chunk.\n- **Fewer thread-local lookups.** The hot runtime thread-locals live in one struct (`alx_tls`): on macOS each thread-local costs an address lookup per function, so this is one lookup instead of five. `alx_region_cur`/`use`/`set`/`bytes` are inline, and `alx_region_of` caches its last 1 MB granule.\n\n### Escapes\n- **Clean function types.** A call through a function value no longer sends its arguments to the program region when every lambda of that function type keeps its parameters to itself. This is what `slices.sort_func(pairs) { ... }` needed.\n- **Map keys.** A `Str` key is copied when it's inserted (strings are immutable, so it can't be told apart), so the key passed in doesn't have to outlive the call. wordfreq's million temporary words are freed each iteration: 52 MiB → 5.7.\n\n### Strings and maps\n- **`s += x` appends in place.** When `s` is the most recent concatenation and ends at the bump pointer, the new bytes go after it: building a string piece by piece is linear. `\"\" + x` is `x`.\n- **`split`** finds separators with `memchr` instead of a `memcmp` at every byte (strchurn 49 → 19 ms).\n- **Short string compares are inline.**\n- **Maps remember the last entry found.** `m[k] = f(m[k])` hashes once.\n- **Deleted entries leave a tombstone in the slot table,** so lookups don't read the `live` array.\n\n### Still to do\n- wordfreq is about 1.15x Go: one lookup is a hash, then a slot, then the key, in a row. Go's swiss tables do about the same work, with control bytes beside the keys.\n- strchurn keeps its 200k split results for the whole loop (82 MiB).\n"}], "milestones": [{"id": "m1", "num": "M1", "name": "Numbers", "contents": "`I8..I64`, `U8..U64`, `Byte`, `Rune` (Int = I64); hex/octal/binary literals; bitwise `\u0026 \\| ^ \u003c\u003c \u003e\u003e \u0026^` and unary `^`; wrapping `+% -% *%`; explicit conversions (`x.to_u32`); per-type overflow checks; Go's exact constants and top-level `const` (visible inside defs)", "done": true}, {"id": "m2", "num": "M2", "name": "Everyday syntax", "contents": "`for x in xs`; `case x { pat =\u003e v }` (values, ranges, `_`); `\"#{x}\"` interpolation; block-scoped `defer`; `fn` / `ƒ` = `#[pure] def`; `else if`", "done": true}, {"id": "m3", "num": "M3", "name": "Collections and absence", "contents": "C1: `[T]` slices (shared storage, `a[lo...hi]`, append, `copy`), `[T; N]` fixed arrays; Str as bytes (`s[i]` is a Byte, `bytes`, `runes`); ordered `Map[K, V]` with literals; `T?` with narrowing (`if x = e`), `\\|\\|`, `?.`, `none`; lookups, `find`, `first`, `max` return `T?`", "done": true}, {"id": "m4", "num": "M4", "name": "Types", "contents": "methods inside structs (`def m!` mutates); `enum` with payloads and exhaustive `case`; structural `interface`s with default methods; operator overloading through interfaces; explicit generics `[T]` on defs and structs (`like Int` bounds); escaping lambdas `-\u003e(x) { }`", "done": true}, {"id": "m5", "num": "M5", "name": "Errors", "contents": "`error` declarations; `~T`, `~T\u003cE\u003e`, `~T\u003cError\u003e`; `~` propagation (replaces `try`); inferred closed sets; Results as values; `rescue`, `fail`, `case` over errors, `wrap`/`cause`; printing", "done": true}, {"id": "m6", "num": "M6", "name": "Packages and refinements", "contents": "directory packages, `import \"path\"`, `pub`; `alx.mod`; `refine` / `using`, lexically scoped", "done": true}, {"id": "m7", "num": "M7", "name": "Concurrency", "contents": "`spawn`, `Chan[T]`, `select`, waiting, `Context`; a panic kills its task, not the process", "done": true}, {"id": "m8", "num": "M8", "name": "Tooling", "contents": "`alx fmt`; `alx test` (`*_test.alx`, `test`, `bench`, output-checked examples); unused warnings and `--strict`", "done": true}, {"id": "r1", "num": "R1", "name": "Scoped regions", "contents": "runtime regions (chunked arenas, per thread); escape analysis; allocations that can't outlive a function call or a loop iteration go in that scope's region and are freed when it ends; everything else stays in the program region (today's behavior). Bounded memory for loops and call-heavy code", "done": true}, {"id": "r2", "num": "R2", "name": "Returns and placement", "contents": "escaping values are placed in the region they escape to (region parameters: a function allocates its result in the caller's region); fewer values reach the program region", "done": true}, {"id": "r3", "num": "R3", "name": "Containers that churn", "contents": "(R11, refining R1's refcounts) a Map or Pool made in a function and mutated in a loop owns a child region; live contents are compacted into a fresh region once garbage outweighs them. Pools reuse slots behind generational handles. Long-running loops with caches stay bounded. Done: churn.alx 24 MB → 3 MB", "done": true}, {"id": "r4", "num": "R4", "name": "Captures, receivers, pools", "contents": "captures by reference (R5); `!` methods through interfaces (R7); `@T` handles and pools for recursive and graph data (R3)", "done": true}, {"id": "r5", "num": "R5", "name": "M:N tasks", "contents": "stackful coroutines over a worker thread per core (S4's scheduler; the I/O event loop comes with `net` in L3); channels, `select`, `wait` and locks park tasks instead of threads; region state follows the task. Done: 100,000 tasks in a daisy chain in 0.67 s and 105 MB", "done": true}, {"id": "r6", "num": "R6", "name": "Sharing", "contents": "`Mutex[T]`, `Atomic[T]`; moves into `spawn` and channels; unsynchronized sharing is a compile error", "done": true}, {"id": "r7", "num": "R7", "name": "Explain", "contents": "`alx explain mem`: each allocation's region and why (what sends it to the program region); sites inside loops that pile up are marked", "done": true}, {"id": "l1", "num": "L1", "name": "Text \u0026 data core", "contents": "strings, strconv, unicode, unicode/utf8, bytes, slices, maps, sort, math, fmt, errors — Go's APIs, alx idioms (S2); tuples, functions as values, blocks for function parameters. Done: 11 packages, 172 test blocks", "done": true}, {"id": "l2", "num": "L2", "name": "Systems core", "contents": "os, io, bufio, time, flag, path, path/filepath over a C FFI (`extern def`); tasks sleep without blocking their worker. Done: 7 packages, 115 test blocks plus ~1,700 Go-generated assertions", "done": true}, {"id": "l3", "num": "L3", "name": "Server core", "contents": "I/O event loop (kqueue/epoll) under R5's scheduler; net, net/http (Go 1.22 routing, keep-alive, client), encoding/json via `#[derive(Json)]` (S3), context, sync. Done: ~46k req/s in-process hello-world; 10k idle connections in 454 MB", "done": true}, {"id": "t1", "num": "T1", "name": "Scripting", "contents": "command literals (`` `cat #{f} \\| grep -c x` ``, parsed by alx; each `#{}` one argument), Go's `os/exec` plus pipelines, redirects and `ProcessState` measurements, the `sh` package (files, `**` globs, scoped `in_dir`/`with_env`, `parallel`); fallible lambdas. The repository's Python tooling is now alx", "done": true}]};
const byId = Object.fromEntries(DATA.docs.map(d => [d.id, d]));
const planNav = document.getElementById('nav-plan');
const msNav = document.getElementById('nav-ms');
const doc = document.getElementById('doc');

function link(href, tag, name, cls) {
  const a = document.createElement('a');
  a.className = 'navlink ' + (cls || '');
  a.href = '#' + href;
  a.dataset.id = href;
  const t = document.createElement('span'); t.className = 'tag'; t.textContent = tag;
  const n = document.createElement('span'); n.className = 'name'; n.textContent = name;
  a.append(t, n);
  return a;
}
planNav.append(link('roadmap', '→', 'Roadmap'), link('decisions', '↔', 'Go vs Ruby decisions'));
if (byId.m0) msNav.append(link('m0', 'M0', 'Where things stood', ''));
const PUSH = { M: 'Go parity', R: 'Memory model', L: 'Standard library' };
let lastPush = null;
for (const m of DATA.milestones) {
  const p = m.num[0];
  if (p !== lastPush && PUSH[p]) {
    const h = document.createElement('div'); h.className = 'subhead'; h.textContent = PUSH[p];
    msNav.append(h);
    lastPush = p;
  }
  msNav.append(link(m.id, m.num, m.name, m.done ? '' : 'planned'));
}

function progressStrip() {
  const wrap = document.createElement('div');
  wrap.className = 'progress';
  for (const m of DATA.milestones) {
    const a = document.createElement('a');
    a.className = 'step' + (m.done ? ' done' : '');
    a.href = '#' + m.id;
    const n = document.createElement('span'); n.className = 'n';
    const l = document.createElement('span'); l.textContent = m.num;
    const s = document.createElement('span'); s.textContent = m.done ? 'done' : 'planned';
    n.append(l, s);
    const t = document.createElement('span'); t.className = 't'; t.textContent = m.name;
    a.append(n, t);
    wrap.append(a);
  }
  return wrap;
}

function render() {
  const id = (location.hash || '#roadmap').slice(1);
  doc.replaceChildren();
  let d = byId[id];
  if (!d) {
    const m = DATA.milestones.find(x => x.id === id);
    if (m) {
      d = { md: `# ${m.num}: ${m.name}\n\nNot started yet. This milestone covers: ${m.contents}\n\nIts write-up appears here when it's done.` };
    } else {
      d = byId.roadmap;
    }
  }
  if (id === 'roadmap' || !location.hash) {
    const h = document.createElement('h1'); h.textContent = 'Roadmap';
    const meta = document.createElement('p'); meta.className = 'meta';
    const done = DATA.milestones.filter(m => m.done).length;
    meta.textContent = `${done} of ${DATA.milestones.length} milestones done`;
    doc.append(h, meta, progressStrip());
    const body = document.createElement('div');
    body.innerHTML = marked.parse(d.md.replace(/^# .+\n/, ''));
    doc.append(body);
  } else {
    doc.innerHTML = marked.parse(d.md);
  }
  for (const t of doc.querySelectorAll('table')) {
    const w = document.createElement('div'); w.className = 'tablewrap';
    t.replaceWith(w); w.append(t);
  }
  for (const a of document.querySelectorAll('.navlink')) a.classList.toggle('current', a.dataset.id === id || (!location.hash && a.dataset.id === 'roadmap'));
  window.scrollTo(0, 0);
}
addEventListener('hashchange', render);
render();
</script>
