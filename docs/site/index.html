<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a compiler's engineering notebook. Sidebar of milestones on the left,
   one reading column (~68ch) on the right; stacks to a top strip on phones.
   Accent follows the alexandrite effect: green by daylight, raspberry by lamplight. */
:root {
  --bg: #f6f7f4;
  --panel: #eceee8;
  --fg: #1d2420;
  --muted: #5c6862;
  --rule: #d3d8d1;
  --accent: #1e7563;
  --accent-soft: #d6ebe4;
  --done: #1e7563;
  --code-bg: #e6e9e3;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --step--1: 0.84rem;
  --step-0: 1rem;
  --step-1: 1.22rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131a; --panel: #1f1a23; --fg: #ece5ea; --muted: #a596a2; --rule: #3a3140;
    --accent: #e4678a; --accent-soft: #3d2230; --done: #e4678a; --code-bg: #241e29;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131a; --panel: #1f1a23; --fg: #ece5ea; --muted: #a596a2; --rule: #3a3140;
  --accent: #e4678a; --accent-soft: #3d2230; --done: #e4678a; --code-bg: #241e29;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 var(--step-0)/1.65 var(--font-body); }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.shell { display: grid; grid-template-columns: 17rem minmax(0, 1fr); min-height: 100%; }
nav.side {
  background: var(--panel); border-right: 1px solid var(--rule);
  padding-block: 1.6rem; padding-inline: 1.2rem;
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 1.4rem;
}
.brand { font: 700 var(--step-1)/1.1 var(--font-display); letter-spacing: -0.01em; }
.brand small { display: block; font: 500 var(--step--1)/1.3 var(--font-mono); color: var(--muted); letter-spacing: 0; margin-top: 0.35rem; }
.navgroup { display: flex; flex-direction: column; gap: 0.15rem; }
.navgroup h2 { font: 600 0.7rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 0 0.45rem; }
.navlink {
  display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); align-items: baseline; gap: 0.35rem;
  padding: 0.32rem 0.5rem; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 0.93rem; line-height: 1.35;
}
.navlink .tag { font: 600 0.72rem/1 var(--font-mono); color: var(--muted); }
.navlink.current { background: var(--accent-soft); }
.navlink.current .tag { color: var(--accent); }
.navlink.planned { color: var(--muted); }
.navlink:hover { background: var(--accent-soft); }

main { padding-block: 2.4rem 4rem; padding-inline: clamp(1rem, 4vw, 3.5rem); min-width: 0; }
article { max-width: 68ch; }
article h1 { font: 700 var(--step-3)/1.1 var(--font-display); letter-spacing: -0.02em; margin: 0 0 1.2rem; text-wrap: balance; }
article h2 { font: 700 var(--step-2)/1.2 var(--font-display); letter-spacing: -0.01em; margin: 2.4rem 0 0.8rem; text-wrap: balance; }
article h3 { font: 600 var(--step-1)/1.3 var(--font-display); margin: 1.8rem 0 0.6rem; }
article p, article li { margin: 0 0 0.9rem; }
article ul, article ol { padding-left: 1.3rem; margin: 0 0 1rem; }
article code { font: 400 0.86em/1.4 var(--font-mono); background: var(--code-bg); padding: 0.08em 0.32em; border-radius: 4px; }
article pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 0.9rem 1rem; overflow-x: auto; margin: 0 0 1.2rem; }
article pre code { background: none; padding: 0; font-size: 0.84rem; line-height: 1.55; }
.tablewrap { overflow-x: auto; margin: 0 0 1.4rem; border: 1px solid var(--rule); border-radius: 8px; }
article table { border-collapse: collapse; width: 100%; font-size: 0.88rem; line-height: 1.45; font-variant-numeric: tabular-nums; }
article th { font: 600 0.74rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); text-align: left; background: var(--panel); }
article th, article td { padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
article tr:last-child td { border-bottom: 0; }
article blockquote { margin: 0 0 1rem; padding-left: 1rem; border-left: 3px solid var(--accent); color: var(--muted); }

.progress { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.2rem, 1fr)); gap: 0.5rem; margin: 0 0 2rem; max-width: 68ch; }
.step { border: 1px solid var(--rule); border-radius: 8px; padding: 0.6rem 0.7rem; text-decoration: none; color: var(--fg); display: flex; flex-direction: column; gap: 0.2rem; }
.step .n { font: 600 0.72rem/1 var(--font-mono); color: var(--muted); display: flex; justify-content: space-between; }
.step .t { font: 600 0.92rem/1.25 var(--font-display); }
.step.done { border-color: var(--done); background: var(--accent-soft); }
.step.done .n { color: var(--done); }
.step:hover { border-color: var(--accent); }
.meta { font: 400 var(--step--1)/1.4 var(--font-mono); color: var(--muted); margin: -0.6rem 0 1.6rem; }

@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding-block: 1rem; padding-inline: 1rem; gap: 0.9rem; }
  .navgroup { flex-direction: row; flex-wrap: wrap; gap: 0.3rem; }
  .navgroup h2 { width: 100%; margin-bottom: 0.2rem; }
  .navlink { grid-template-columns: auto; padding: 0.3rem 0.55rem; border: 1px solid var(--rule); }
  .navlink .name { display: none; }
  .navgroup.plan .navlink .name { display: inline; }
  main { padding-block: 1.6rem 3rem; padding-inline: 1rem; }
}
@media (prefers-reduced-motion: no-preference) { .step, .navlink { transition: background 0.15s, border-color 0.15s; } }
</style>

<script>
const DATA = {"docs": [{"id": "roadmap", "title": "Roadmap", "group": "plan", "md": "# Roadmap: Go parity, errors, refinements\n\nGoal of this push (user, 2026-10-01): **finish the language** to Go parity, plus DESIGN.md's error system and refinements, so the next step can be porting Go's standard library. The memory model (pools, the move/region checker) is a separate conversation *after* this push; until then everything lives in v0's program-lifetime region.\n\nEvery decision these milestones implement is in `GO-VS-RUBY.md`. Each milestone ends with: acceptance cases (`acceptance/cases/`), all backends agreeing (JIT, clang debug/release, Rust oracle; the browser where the feature makes sense there), `run.py` green, a milestone doc in `docs/milestones/`, a commit, and an update to the doc site.\n\n| # | Milestone | Contents |\n|---|---|---|\n| M1 | **Numbers** | `I8..I64`, `U8..U64`, `Byte`, `Rune` (Int = I64); hex/octal/binary literals; bitwise `& \\| ^ << >> &^` and unary `^`; wrapping `+% -% *%`; explicit conversions (`x.to_u32`); per-type overflow checks; Go's exact constants and top-level `const` (visible inside defs) |\n| M2 | **Everyday syntax** | `for x in xs`; `case x { pat => v }` (values, ranges, `_`); `\"#{x}\"` interpolation; block-scoped `defer`; `fn` / `\u0192` = `#[pure] def`; `else if` |\n| M3 | **Collections and absence** | C1: `[T]` slices (shared storage, `a[lo...hi]`, append, `copy`), `[T; N]` fixed arrays; Str as bytes (`s[i]` is a Byte, `bytes`, `runes`); ordered `Map[K, V]` with literals; `T?` with narrowing (`if x = e`), `\\|\\|`, `?.`, `none`; lookups, `find`, `first`, `max` return `T?` |\n| M4 | **Types** | methods inside structs (`def m!` mutates); `enum` with payloads and exhaustive `case`; structural `interface`s with default methods; operator overloading through interfaces; explicit generics `[T]` on defs and structs (`like Int` bounds); escaping lambdas `->(x) { }` |\n| M5 | **Errors** | `error` declarations; `~T`, `~T<E>`, `~T<Error>`; `~` propagation (replaces `try`); inferred closed sets; Results as values; `rescue`, `fail`, `case` over errors, `wrap`/`cause`; printing |\n| M6 | **Packages and refinements** | directory packages, `import \"path\"`, `pub`; `alx.mod`; `refine` / `using`, lexically scoped |\n| M7 | **Concurrency** | `spawn`, `Chan[T]`, `select`, waiting, `Context`; a panic kills its task, not the process |\n| M8 | **Tooling** | `alx fmt`; `alx test` (`*_test.alx`, `test`, `bench`, output-checked examples); unused warnings and `--strict` |\n\nOrder is by dependency: numbers and syntax first (small, everything uses them), then collections (C1 changes array semantics under everything), then types, errors (which use enums and interfaces), packages, concurrency (which uses all of it) and tooling.\n"}, {"id": "decisions", "title": "Go vs Ruby decisions", "group": "plan", "md": "# Go vs Ruby: decision log\n\nAlexandrite's **capabilities and use case follow Go** (a GC-less Go: services, tools, systems code), and Go's standard library will be ported later, minus the parts that only exist for Go's GC. **Ruby is a source of syntax and ergonomics**, not semantics. This file lists every place the two disagree that we can see coming, so each is decided once, deliberately, before code depends on it.\n\nStatus: **decided** (with who/when), **open** (recommendation given), or **current** (what v0 does today, not yet confirmed). Recommendations lean Go wherever the stdlib port depends on it.\n\n## Numbers\n\n| # | Question | Go | Ruby | Alexandrite now | Recommendation | Status |\n|---|---|---|---|---|---|---|\n| N1 | How `puts`/`to_s` print a Float | `fmt.Println`: `100`, `1e+06`, `+Inf` | `100.0`, `1.0e+16`, `Infinity` | Go | Go | **decided** (user, 2026-10-01) |\n| N2 | `sum` of Floats | plain loop | Kahan\u2013Babu\u0161ka compensated | plain | Go | **decided** (Go reference) |\n| N3 | `format` / printf verbs | `%v %d %s %t %f %.Nf %e %g %x %q`, widths, flags; `%s` only for strings | Kernel#format (C-like; `%s` takes anything) | Go subset: `%v %d %s %t %f %.Nf` | Go verbs; grow with the `fmt` port | **decided** (Go reference) |\n| N4 | Int and Float in one expression (`1 + x` where `x` is Float) | compile error unless the Int is an untyped constant; variables need `float64(i)` | implicit conversion | implicit (Ruby) | Go: literals adapt, Int *variables* need `.to_f` (an i64 above 2^53 silently loses precision) | **decided: Go** (user, 2026-10-01) |\n| N5 | Constant arithmetic | exact, arbitrary precision at compile time (`0.1 + 0.2 == 0.3`; `-0.0` is `+0`) | ordinary runtime floats | runtime floats | keep runtime semantics for v0; revisit with the constant system | **decided: Go's exact constants** (user, 2026-10-01) |\n| N6 | Integer `/` and `%` with negatives | truncate: `-7 / 2 == -3`, `-7 % 2 == -1` | floor: `-4`, `1` | floor (Ruby) | Go: ported code (hashing, encoding, time) assumes truncation | **decided: Go, truncate** (user, 2026-10-01) |\n| N7 | Integer types | `int8..int64`, `uint8..uint64`, `uintptr`, `int` = 64-bit, `byte`, `rune` | one `Integer` (bignum on demand) | `Int` = i64; bignums via `#![overflow(promote)]` | add Go's sized and unsigned types; `Int` stays the default | **decided: Go's full set**: I8..I64, U8..U64, Int = I64, Byte = U8, Rune = I32; literals adapt, sized types convert explicitly (user, 2026-10-01) |\n| N8 | Integer overflow | wraps silently | promotes to bignum | panics (or `try`); directives for `wrap` / `promote` | keep panic as default; add explicit wrapping operators (e.g. `+%`, as in Zig) so crypto/hash ports don't need a file-wide `#![overflow(wrap)]` | **decided: panic by default; wrapping operators `+%` `-%` `*%`** (plus `#![overflow(wrap)]` per file) (user, 2026-10-01) |\n| N9 | Float \u2192 Int | truncates; NaN or out of range is implementation-defined | `FloatDomainError`, or a bignum | truncates; panics on NaN, \u00b1Inf and out of range | keep the panic (safety over Go's silence) | current |\n| N10 | `**` power operator | none (`math.Pow`) | `**` | `**` on Int | keep `**`; add `math.pow` with the stdlib | current |\n\n## Strings and text\n\n| # | Question | Go | Ruby | Alexandrite now | Recommendation | Status |\n|---|---|---|---|---|---|---|\n| S1 | `s.size` | bytes (`len(s)`) | characters | bytes | Go; characters via `s.chars.size` / a rune count | current |\n| S2 | Mutability | immutable `string`; build with `strings.Builder` / `[]byte` | mutable `String`, `<<` | immutable | Go | current |\n| S3 | `byte` and `rune` types | yes | no (Integers) | no | add `Byte` and `Rune` (needed for the stdlib) | **decided: Go model**: `s[i]` is a Byte, `s.bytes`, `s.runes`, `s.size` in bytes (user, 2026-10-01) |\n| S4 | String interpolation `\"#{x}\"` | none (`fmt.Sprintf`) | yes | no | add it: pure syntax, lowers to `format` with `%v` | **decided: add `\"#{x}\"`**, lowering to `%v` formatting (user, 2026-10-01) |\n| S5 | Symbols `:name` | none | yes | only `&:sym` block shorthand | keep it to that | current |\n| S6 | Invalid UTF-8 | strings are arbitrary bytes | encoding errors | arbitrary bytes | Go | current |\n\n## Collections\n\n| # | Question | Go | Ruby | Alexandrite now | Recommendation | Status |\n|---|---|---|---|---|---|---|\n| C1 | Array semantics | arrays are values; **slices are views sharing a backing array**; APIs mutate through slices (`sort`, `copy`, `io.Reader.Read(p []byte)`) | references to one growable array | growable arrays with **value semantics** (copied on assign and on pass) | Go's split: owned growable `Array` plus a borrowed slice view (`a[lo...hi]`) that functions can mutate through; pools make view lifetimes checkable. Biggest decision here: it shapes every stdlib signature | **decided: both, as in Go** (user, 2026-10-01): fixed-size value arrays *and* slices, designed to make sense together. Design to be written up and approved before implementation |\n| C2 | Hash / map | `map`, unordered (randomized iteration) | `Hash`, insertion-ordered | none yet (DESIGN.md says insertion-ordered) | insertion-ordered (deterministic output; no Go code depends on the randomness); name it `Map` or `Hash` | **decided: insertion-ordered `Map[K, V]`**, literal `{k => v}` (user, 2026-10-01) |\n| C3 | nil vs zero values | zero values for every type; `nil` for pointers/slices/maps/interfaces | `nil` everywhere | zero values internally; `T?` planned | Go zero values; `T?` instead of nil pointers | **decided: no nil anywhere; Go zero values + `T?`** (checked narrowing, `||`, `?.`, `none`) (user, 2026-10-01) |\n| C4 | Struct construction | `Body{X: 1, Mass: m}`, omitted fields zero | `Struct.new(1, 2)` or keywords | `Body.new(positional...)` | `Body.new(x: 1.0, mass: m)` with omitted fields zero (Go semantics, Ruby keyword look); positional allowed too | **decided: keywords + zero values, positional also allowed** (user, 2026-10-01) |\n| C5 | Struct semantics | values (copied) | references | values | Go | current |\n\n## Functions, methods, errors\n\n| # | Question | Go | Ruby | Alexandrite now | Recommendation | Status |\n|---|---|---|---|---|---|---|\n| F1 | Methods on structs | receivers declared outside the type; value vs pointer receivers | `def` inside the class; everything a reference | none | methods inside `struct Name { ... }`; a mutating method marked like Ruby's `!` (`def move!`) = Go pointer receiver | **decided: methods inside `struct { }`; `def name!` may mutate self (pointer receiver), plain `def` gets a copy** (user, 2026-10-01) |\n| F2 | Polymorphism | structural interfaces, satisfied implicitly | duck typing | none (DESIGN.md: traits, inferred `dyn`) | Go-style structural interfaces (`io.Reader` ports directly) | **decided: structural interfaces with default methods** (user, 2026-10-01) |\n| F3 | Errors | `error` values (interface), `(T, error)` returns, wrapping (`%w`, `errors.Is/As`) | exceptions | `T!` + `try`; one global `Err` | keep `T!`/`try` syntax; make the error type Go-like (interface, wrapping) so `(T, error)` ports to `T!` | **decided: Rust-shaped, layered** (user, 2026-10-01): closed inferred sets inside packages, every error implements `Error` (message, cause), open `~T<Error>` at boundaries; Results are values (`map`, `ok`, `err`, `unwrap_or`, `unwrap`); io/bufio follow Rust's std shape (EOF = `0`/`none`, `write_all`, `read_exact`). Spelling: see E1\u2013E4 |\n| F4 | Multiple return values | yes | arrays + destructuring | tuples + multi-assign | tuples are Go's multiple returns | current |\n| F5 | Cleanup | `defer` | `ensure`, blocks | none | `defer` | **decided: `defer`, block-scoped** (user, 2026-10-01) |\n| F6 | Panics | `panic` / `recover` (net/http recovers per request) | `raise` / `rescue` | abort the process | abort for now; per-task panic isolation later, so one bad request can't kill a server | **decided: a panic kills its task, not the process**; main still aborts; no general `recover` (user, 2026-10-01) |\n| F7 | Closures | func literals capture by reference | blocks | non-escaping blocks, inlined; explicit lambdas escape | keep | current |\n\n## Concurrency\n\n| # | Question | Go | Ruby | Alexandrite now | Recommendation | Status |\n|---|---|---|---|---|---|---|\n| K1 | Model | goroutines, channels, `select`, `sync`, `context` | threads, fibers, Ractors | `pmap`; DESIGN.md plans CSP (`spawn`, `concurrently`) with async inferred | Go's model and names (channels, `select`, `WaitGroup`, `context`), with DESIGN.md's inferred async | **decided: Go's model, Ruby-ish spelling**: `spawn {}`, `Chan[T]`, `ch << v`, `ch.recv`, `select { when ... }`, `Context` (user, 2026-10-01) |\n\n## Program structure and tooling\n\n| # | Question | Go | Ruby | Alexandrite now | Recommendation | Status |\n|---|---|---|---|---|---|---|\n| P1 | Packages | directory = package, `import \"path\"`, exported = Capitalized | `require` files, modules | `require \"file\"` | Go's directory packages and import paths; export with an explicit `pub` (Capitalized already means a type) | **decided: directory packages, `import \"path\"`, export with `pub`** (`require` goes away) (user, 2026-10-01) |\n| P2 | Naming of ported APIs | `strings.HasPrefix` | `start_with?` | snake_case | transliterate Go names to snake_case (`strings.has_prefix`); `?` on predicates | **decided: snake_case transliteration**, `?` on predicates, method sugar where natural (user, 2026-10-01) |\n| P3 | Unused variables / imports | compile errors | warnings at most | silent | warnings | **decided: warnings; errors under `--strict` and in `alx test`**; `_` silences (user, 2026-10-01) |\n| P4 | Formatter | `gofmt` (one style, no options) | rubocop (configurable) | none | `alx fmt`, gofmt-style | **decided: `alx fmt`, no options** (user, 2026-10-01) |\n| P5 | Tests | `go test`, `_test.go`, table tests, benchmarks | minitest / rspec | acceptance harness only | `alx test`, `_test.alx`, `go test` conventions including benchmarks | **decided: Go's conventions**: `alx test`, `*_test.alx`, `test \"name\" {}`, `bench`, output-checked examples (user, 2026-10-01) |\n| P6 | Dependencies | `go.mod`, minimal version selection, module proxy | gems, bundler | none | Go's module model | **decided: Go's module model**: `alx.mod`, URL imports, MVS, `alx.sum` (user, 2026-10-01) |\n| P7 | Truthiness | only `bool` | `nil`/`false` falsy | only `Bool` | Go | current |\n\n## Taste (not Go-vs-Ruby, but likely points of disagreement)\n\n| # | Question | Decision |\n|---|---|---|\n| T1 | Function keyword | `def`; **`fn` and `\u0192` mean `#[pure] def`** (user, 2026-10-01) |\n| T2 | Return values | implicit last expression; `return` for early exits (user, 2026-10-01) |\n| T3 | Parameter types | untyped = generic with an inferred bound inside a package; `pub` functions spell their types (user, 2026-10-01) |\n| T4 | Operator overloading | through standard interfaces only: `==`, `<=>`, `+ - * /`, `[]`; no custom operator symbols (user, 2026-10-01) |\n| T5 | Sum types | `enum` with payloads, exhaustive matching; payload-free enums cover Go's iota (user, 2026-10-01) |\n| T6 | Matching | `case x { pattern => value }`, an expression; values, ranges, enum patterns, `_` (user, 2026-10-01) |\n| T7 | Loops | add `for x in xs { }` (statement; `break`/`next`/`return` as in Go's for-range) alongside Enumerable (user, 2026-10-01) |\n| T8 | Arrays | C1: `[T]` is a Go slice (shared storage, reslicing, append); `[T; N]` a fixed-size value array whose slices view its storage (user, 2026-10-01) |\n\n## Errors and optionals: spelling (user, 2026-10-01)\n\nThe logic: **fallibility is a prefix** (\"approximately do this\", \"you'll probably get this\"), **optionality is a suffix** (it matches `?` on Bool methods). `!` means only \"mutates\".\n\n| # | Form | Meaning |\n|---|---|---|\n| E1 | `~T` / `~T<ParseError>` / `~T<ParseError \\| IoError>` / `~T<Error>` | fallible T: inferred set / declared set / union / open (any error). `< >` is reserved for error sets; generics use `[ ]` (Go, RBS) |\n| E2 | `T?` | optional T (no nil anywhere). `~T?<E>` = may fail, else maybe a T; `~T<E>?` = maybe a fallible T. `~` takes the type to its right including its `?` |\n| E3 | `~f(x)`, `x.~m(y)`, `~(a * b)`, `~r` | propagate: the `~` attaches to the call whose name follows it (not the whole chain), or to a parenthesized expression or a held Result. A fallible call in a chain without its own `~` is an error that says where to put it |\n| E4 | no `~` | you hold the Result value (`~T`); unused Results warn |\n| E5 | Go's `~int` approximation constraint | spelled `like Int` in generic bounds, so `~` keeps one meaning |\n| E6 | `rescue { \\|e\\| ... }`, `case e { Variant(x) => ... }`, `fail E`, `e.wrap(\"ctx\")` | handling, exhaustive over closed sets, `_` required on open ones |\n\n## Derived decisions (made while building; flagged for review)\n\n| # | Question | Decision | Milestone |\n|---|---|---|---|\n| D1 | Operator precedence | Ruby's order with Go's operators slotted in (`\\| ^` < `& &^` < `<< >>` < `+ -` < `* / %`); the Go port parenthesizes where Go's order differs | M1 |\n| D2 | Shifts | Go: no overflow panic, count >= width gives 0 (or -1), negative count panics | M1 |\n| D3 | Conversions | `to_X` checked (panics), `as_X` truncates like Go's `X(v)` | M1 |\n| D4 | Constants | Ruby spelling (`NAME = expr` at the top level, capitalized), Go's exact semantics | M1 |\n"}, {"id": "m0", "title": "M0: Where things stood", "group": "log", "md": "# M0: Where things stood\n\nBefore the Go-parity push (2026-10-01), Alexandrite was a working v0 compiler built to pass the Project Euler acceptance suite (ACCEPTANCE.md A1\u2013A7).\n\n## What exists\n\n- **Front end:** lexer, parser (braces-only, Ruby-flavored), checker with per-instance type inference and monomorphization, purity checking, and a small prover that removes overflow and index checks it can prove unnecessary.\n- **Backends, all from one low-level IR:**\n  - C via clang, for release builds (`alx build --release`); within about 1x of hand-written Rust on the benchmarks.\n  - A Cranelift JIT behind `alx run`: about 2 ms from edit to answer on small programs.\n  - A Rust \"oracle\" backend, compiled by rustc in CI to cross-check every program.\n  - WebAssembly, compiled in the browser: the playground on the website.\n- **Language:** Int (64-bit, overflow panics; `promote` and `wrap` modes), Float, Bool, Str, arrays, tuples, value structs with keyword construction, ranges, Enumerable chains fused into single loops, generators (`Enumerator.new`), `pmap`, `try` on fallible calls, `format` with Go's verbs, `require`d libraries.\n\n## Benchmarks at this point\n\n| program | alx release | Go | Rust | edit-to-answer: `alx run` vs `go run` |\n|---|---|---|---|---|\n| n-body, 1M steps | 30.1 ms | 34.8 ms | 31.6 ms | 69 ms vs 229 ms |\n| Project Euler (12 problems) | 1.1\u20131.4x faster than prebuilt Go, mostly startup; even with hand-optimized Go on the work itself | | | 7.5\u201392x faster |\n\n## What changed in direction\n\nGo became the reference for capabilities and semantics, Ruby the reference for syntax feel. Every divergence between them was decided up front with the user (GO-VS-RUBY.md). The rest of this site follows the milestones in the roadmap.\n"}, {"id": "m1", "title": "M1: Numbers", "group": "log", "md": "# M1: Numbers\n\nGo's integer types, exact constants and bit operations, on every backend: the JIT behind `alx run`, clang debug and release, the Rust oracle, and the browser. The test program `acceptance/cases/ints.alx` is a line-for-line port of a Go program, and all five backends print exactly what Go prints.\n\n## What you can write now\n\n```ruby\nBIG = 1 << 100                # constants are exact: no overflow until used\nSHIFTED = BIG >> 98           # 4\nKB: U32 = 1024                # a typed constant\nputs 0.1 + 0.2                # 0.3: folded exactly, as in Go\n\na: U8 = 200\nputs a +% 56                  # 0: wrapping arithmetic\nputs a + 56                   # panics: overflow (U8) at file:line:col\nputs ^a                       # 55: complement\nx = 0xff_ff\nputs x & 0x0f0f, x &^ 0xff    # bit operations, Go's and-not\nputs 1 << n                   # 0 once n >= 64, as in Go\n\nu: U64 = 18_446_744_073_709_551_615\nputs u / 3                    # unsigned division, comparison, printing\nputs 300.as_u8                # 44: truncates, like Go's uint8(300)\nputs 300.to_u8                # panics: the value doesn't fit U8\nputs format(\"%x %o %b %c\", 255, 8, 5, 9731)   # ff 10 101 \u2603\n\nstruct Pix { r: U8, g: U8, b: U8, a: U8 }     # 4 bytes in memory\nh: U32 = 2166136261           # FNV-1a: wrapping multiply where it's meant\n\"go\".bytes.each { h = (h ^ it.as_u32) *% 16777619 }\n```\n\n## What was built\n\n- **Types:** `I8 I16 I32 I64 U8 U16 U32 U64`, with `Int` = I64, `Byte` = U8 and `Rune` = I32. In registers every integer is a 64-bit value (sign- or zero-extended); in arrays and structs each takes its own width, so `[U8]` is a byte buffer.\n- **Literals:** `0x`, `0o`, `0b`, underscores, and integers of any size as constants.\n- **Constants (Go's rules):** literals and `NAME = expr` definitions are exact (big integers, exact rationals) and take a type only where they're used; one that doesn't fit is a compile error at that point. Typed constants (`KB: U32 = 1024`) behave like values of their type.\n- **Operators:** `& | ^ &^ << >>`, unary `^`, wrapping `+% -% *%`, and compound forms (`&=`, `<<=`, `+%=`, ...).\n- **Overflow:** checked per type; a panic names the type and the source position; under `try` it becomes an error.\n- **Conversions:** `x.to_u8` (checked), `x.as_u8` (truncates); Float \u2192 integer via `to_*`; `to_f` from any integer (unsigned for U64).\n- **Formatting:** `%d` for any integer, `%x %X %o %b %c`.\n- **Typed locals:** `x: U8 = 200`.\n\nThe lowering expands Go's semantics into a handful of primitive operations (bitwise ops, unsigned compare and divide, a narrow-width wrap), so each backend only had to implement those.\n\n## Calls I made (flagged for your review)\n\n| # | Question | What I did | Why |\n|---|---|---|---|\n| D1 | Operator precedence | **Ruby's order**, with Go's extra operators slotted in: `\\| ^` < `& &^` < `<< >>` < `+ -` < `* / %` | keeps `arr << x + 1` meaning \"push x + 1\". Go's order differs mainly for `a + b << 1`; the stdlib port will add parentheses there |\n| D2 | Shifts | **Go's semantics**: no overflow panic; shifting by the width or more gives 0 (or -1 for negative values shifted right); a negative count panics | Go code relies on bits falling off the end |\n| D3 | Conversions | `to_u8` checks (panics if the value doesn't fit), `as_u8` truncates like Go's `uint8(x)` | matches the \"panic by default, wrap when asked\" overflow decision |\n| D4 | Constant names | Ruby spelling: a capitalized name at the top level (`PI = 3.14159`), no `const` keyword | Ruby's syntax, Go's semantics |\n\n## Tests\n\n- `ints.alx`: 39 lines, identical to Go's output on all five backends.\n- Three failure cases: a runtime overflow (abort, message names `U8` and the line), a constant that doesn't fit (`constant 300 overflows U8`), mismatched types (`mismatched types U8 and I32 for '+'`, with a hint to convert).\n- Acceptance: **89 of 89 checks pass**, including the Project Euler and n-body cases; release performance is unchanged (n-body 0.96x of Rust).\n\n## Not yet\n\n- `sum` over sized integers (Int and Float only so far); ranges of sized integers.\n- `**` on sized integers (Go has no `**` at all; Int keeps it).\n- In `#![overflow(promote)]` files, an integer constant above 64 bits is still a compile error rather than a bignum.\n"}], "milestones": [{"id": "m1", "num": "M1", "name": "Numbers", "contents": "`I8..I64`, `U8..U64`, `Byte`, `Rune` (Int = I64); hex/octal/binary literals; bitwise `& \\| ^ << >> &^` and unary `^`; wrapping `+% -% *%`; explicit conversions (`x.to_u32`); per-type overflow checks; Go's exact constants and top-level `const` (visible inside defs)", "done": true}, {"id": "m2", "num": "M2", "name": "Everyday syntax", "contents": "`for x in xs`; `case x { pat => v }` (values, ranges, `_`); `\"#{x}\"` interpolation; block-scoped `defer`; `fn` / `\u0192` = `#[pure] def`; `else if`", "done": false}, {"id": "m3", "num": "M3", "name": "Collections and absence", "contents": "C1: `[T]` slices (shared storage, `a[lo...hi]`, append, `copy`), `[T; N]` fixed arrays; Str as bytes (`s[i]` is a Byte, `bytes`, `runes`); ordered `Map[K, V]` with literals; `T?` with narrowing (`if x = e`), `\\|\\|`, `?.`, `none`; lookups, `find`, `first`, `max` return `T?`", "done": false}, {"id": "m4", "num": "M4", "name": "Types", "contents": "methods inside structs (`def m!` mutates); `enum` with payloads and exhaustive `case`; structural `interface`s with default methods; operator overloading through interfaces; explicit generics `[T]` on defs and structs (`like Int` bounds); escaping lambdas `->(x) { }`", "done": false}, {"id": "m5", "num": "M5", "name": "Errors", "contents": "`error` declarations; `~T`, `~T<E>`, `~T<Error>`; `~` propagation (replaces `try`); inferred closed sets; Results as values; `rescue`, `fail`, `case` over errors, `wrap`/`cause`; printing", "done": false}, {"id": "m6", "num": "M6", "name": "Packages and refinements", "contents": "directory packages, `import \"path\"`, `pub`; `alx.mod`; `refine` / `using`, lexically scoped", "done": false}, {"id": "m7", "num": "M7", "name": "Concurrency", "contents": "`spawn`, `Chan[T]`, `select`, waiting, `Context`; a panic kills its task, not the process", "done": false}, {"id": "m8", "num": "M8", "name": "Tooling", "contents": "`alx fmt`; `alx test` (`*_test.alx`, `test`, `bench`, output-checked examples); unused warnings and `--strict`", "done": false}]};
const byId = Object.fromEntries(DATA.docs.map(d => [d.id, d]));
const planNav = document.getElementById('nav-plan');
const msNav = document.getElementById('nav-ms');
const doc = document.getElementById('doc');

function link(href, tag, name, cls) {
  const a = document.createElement('a');
  a.className = 'navlink ' + (cls || '');
  a.href = '#' + href;
  a.dataset.id = href;
  const t = document.createElement('span'); t.className = 'tag'; t.textContent = tag;
  const n = document.createElement('span'); n.className = 'name'; n.textContent = name;
  a.append(t, n);
  return a;
}
planNav.append(link('roadmap', '→', 'Roadmap'), link('decisions', '↔', 'Go vs Ruby decisions'));
if (byId.m0) msNav.append(link('m0', 'M0', 'Where things stood', ''));
for (const m of DATA.milestones) {
  msNav.append(link(m.id, m.num, m.name, m.done ? '' : 'planned'));
}

function progressStrip() {
  const wrap = document.createElement('div');
  wrap.className = 'progress';
  for (const m of DATA.milestones) {
    const a = document.createElement('a');
    a.className = 'step' + (m.done ? ' done' : '');
    a.href = '#' + m.id;
    const n = document.createElement('span'); n.className = 'n';
    const l = document.createElement('span'); l.textContent = m.num;
    const s = document.createElement('span'); s.textContent = m.done ? 'done' : 'planned';
    n.append(l, s);
    const t = document.createElement('span'); t.className = 't'; t.textContent = m.name;
    a.append(n, t);
    wrap.append(a);
  }
  return wrap;
}

function render() {
  const id = (location.hash || '#roadmap').slice(1);
  doc.replaceChildren();
  let d = byId[id];
  if (!d) {
    const m = DATA.milestones.find(x => x.id === id);
    if (m) {
      d = { md: `# ${m.num}: ${m.name}\n\nNot started yet. This milestone covers: ${m.contents}\n\nIts write-up appears here when it's done.` };
    } else {
      d = byId.roadmap;
    }
  }
  if (id === 'roadmap' || !location.hash) {
    const h = document.createElement('h1'); h.textContent = 'Roadmap';
    const meta = document.createElement('p'); meta.className = 'meta';
    const done = DATA.milestones.filter(m => m.done).length;
    meta.textContent = `${done} of ${DATA.milestones.length} milestones done`;
    doc.append(h, meta, progressStrip());
    const body = document.createElement('div');
    body.innerHTML = marked.parse(d.md.replace(/^# .+\n/, ''));
    doc.append(body);
  } else {
    doc.innerHTML = marked.parse(d.md);
  }
  for (const t of doc.querySelectorAll('table')) {
    const w = document.createElement('div'); w.className = 'tablewrap';
    t.replaceWith(w); w.append(t);
  }
  for (const a of document.querySelectorAll('.navlink')) a.classList.toggle('current', a.dataset.id === id || (!location.hash && a.dataset.id === 'roadmap'));
  window.scrollTo(0, 0);
}
addEventListener('hashchange', render);
render();
</script>
