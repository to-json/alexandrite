<title>Alexandrite Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a compiler's engineering notebook. Sidebar of milestones on the left,
   one reading column (~68ch) on the right; stacks to a top strip on phones.
   Accent follows the alexandrite effect: green by daylight, raspberry by lamplight. */
:root {
  --bg: #f6f7f4;
  --panel: #eceee8;
  --fg: #1d2420;
  --muted: #5c6862;
  --rule: #d3d8d1;
  --accent: #1e7563;
  --accent-soft: #d6ebe4;
  --done: #1e7563;
  --code-bg: #e6e9e3;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --step--1: 0.84rem;
  --step-0: 1rem;
  --step-1: 1.22rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131a; --panel: #1f1a23; --fg: #ece5ea; --muted: #a596a2; --rule: #3a3140;
    --accent: #e4678a; --accent-soft: #3d2230; --done: #e4678a; --code-bg: #241e29;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131a; --panel: #1f1a23; --fg: #ece5ea; --muted: #a596a2; --rule: #3a3140;
  --accent: #e4678a; --accent-soft: #3d2230; --done: #e4678a; --code-bg: #241e29;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 var(--step-0)/1.65 var(--font-body); }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.shell { display: grid; grid-template-columns: 17rem minmax(0, 1fr); min-height: 100%; }
nav.side {
  background: var(--panel); border-right: 1px solid var(--rule);
  padding-block: 1.6rem; padding-inline: 1.2rem;
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 1.4rem;
}
.brand { font: 700 var(--step-1)/1.1 var(--font-display); letter-spacing: -0.01em; }
.brand small { display: block; font: 500 var(--step--1)/1.3 var(--font-mono); color: var(--muted); letter-spacing: 0; margin-top: 0.35rem; }
.navgroup { display: flex; flex-direction: column; gap: 0.15rem; }
.navgroup h2 { font: 600 0.7rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 0 0.45rem; }
.navlink {
  display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); align-items: baseline; gap: 0.35rem;
  padding: 0.32rem 0.5rem; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 0.93rem; line-height: 1.35;
}
.navlink .tag { font: 600 0.72rem/1 var(--font-mono); color: var(--muted); }
.navlink.current { background: var(--accent-soft); }
.navlink.current .tag { color: var(--accent); }
.navlink.planned { color: var(--muted); }
.navlink:hover { background: var(--accent-soft); }

main { padding-block: 2.4rem 4rem; padding-inline: clamp(1rem, 4vw, 3.5rem); min-width: 0; }
article { max-width: 68ch; }
article h1 { font: 700 var(--step-3)/1.1 var(--font-display); letter-spacing: -0.02em; margin: 0 0 1.2rem; text-wrap: balance; }
article h2 { font: 700 var(--step-2)/1.2 var(--font-display); letter-spacing: -0.01em; margin: 2.4rem 0 0.8rem; text-wrap: balance; }
article h3 { font: 600 var(--step-1)/1.3 var(--font-display); margin: 1.8rem 0 0.6rem; }
article p, article li { margin: 0 0 0.9rem; }
article ul, article ol { padding-left: 1.3rem; margin: 0 0 1rem; }
article code { font: 400 0.86em/1.4 var(--font-mono); background: var(--code-bg); padding: 0.08em 0.32em; border-radius: 4px; }
article pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 0.9rem 1rem; overflow-x: auto; margin: 0 0 1.2rem; }
article pre code { background: none; padding: 0; font-size: 0.84rem; line-height: 1.55; }
.tablewrap { overflow-x: auto; margin: 0 0 1.4rem; border: 1px solid var(--rule); border-radius: 8px; }
article table { border-collapse: collapse; width: 100%; font-size: 0.88rem; line-height: 1.45; font-variant-numeric: tabular-nums; }
article th { font: 600 0.74rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); text-align: left; background: var(--panel); }
article th, article td { padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
article tr:last-child td { border-bottom: 0; }
article blockquote { margin: 0 0 1rem; padding-left: 1rem; border-left: 3px solid var(--accent); color: var(--muted); }

.progress { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.2rem, 1fr)); gap: 0.5rem; margin: 0 0 2rem; max-width: 68ch; }
.step { border: 1px solid var(--rule); border-radius: 8px; padding: 0.6rem 0.7rem; text-decoration: none; color: var(--fg); display: flex; flex-direction: column; gap: 0.2rem; }
.step .n { font: 600 0.72rem/1 var(--font-mono); color: var(--muted); display: flex; justify-content: space-between; }
.step .t { font: 600 0.92rem/1.25 var(--font-display); }
.step.done { border-color: var(--done); background: var(--accent-soft); }
.step.done .n { color: var(--done); }
.step:hover { border-color: var(--accent); }
.meta { font: 400 var(--step--1)/1.4 var(--font-mono); color: var(--muted); margin: -0.6rem 0 1.6rem; }

@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding-block: 1rem; padding-inline: 1rem; gap: 0.9rem; }
  .navgroup { flex-direction: row; flex-wrap: wrap; gap: 0.3rem; }
  .navgroup h2 { width: 100%; margin-bottom: 0.2rem; }
  .navlink { grid-template-columns: auto; padding: 0.3rem 0.55rem; border: 1px solid var(--rule); }
  .navlink .name { display: none; }
  .navgroup.plan .navlink .name { display: inline; }
  main { padding-block: 1.6rem 3rem; padding-inline: 1rem; }
}
@media (prefers-reduced-motion: no-preference) { .step, .navlink { transition: background 0.15s, border-color 0.15s; } }
</style>

<div class="shell">
  <nav class="side" aria-label="Notebook">
    <div class="brand">Alexandrite<small>engineering notebook</small></div>
    <div class="navgroup plan" id="nav-plan"><h2>Plan</h2></div>
    <div class="navgroup" id="nav-ms"><h2>Milestones</h2></div>
  </nav>
  <main><article id="doc"></article></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.14/lib/marked.umd.min.js"></script>
<script>
const DATA = /*DATA*/null;
const byId = Object.fromEntries(DATA.docs.map(d => [d.id, d]));
const planNav = document.getElementById('nav-plan');
const msNav = document.getElementById('nav-ms');
const doc = document.getElementById('doc');

function link(href, tag, name, cls) {
  const a = document.createElement('a');
  a.className = 'navlink ' + (cls || '');
  a.href = '#' + href;
  a.dataset.id = href;
  const t = document.createElement('span'); t.className = 'tag'; t.textContent = tag;
  const n = document.createElement('span'); n.className = 'name'; n.textContent = name;
  a.append(t, n);
  return a;
}
planNav.append(link('roadmap', '→', 'Roadmap'), link('decisions', '↔', 'Go vs Ruby decisions'));
if (byId.m0) msNav.append(link('m0', 'M0', 'Where things stood', ''));
for (const m of DATA.milestones) {
  msNav.append(link(m.id, m.num, m.name, m.done ? '' : 'planned'));
}

function progressStrip() {
  const wrap = document.createElement('div');
  wrap.className = 'progress';
  for (const m of DATA.milestones) {
    const a = document.createElement('a');
    a.className = 'step' + (m.done ? ' done' : '');
    a.href = '#' + m.id;
    const n = document.createElement('span'); n.className = 'n';
    const l = document.createElement('span'); l.textContent = m.num;
    const s = document.createElement('span'); s.textContent = m.done ? 'done' : 'planned';
    n.append(l, s);
    const t = document.createElement('span'); t.className = 't'; t.textContent = m.name;
    a.append(n, t);
    wrap.append(a);
  }
  return wrap;
}

function render() {
  const id = (location.hash || '#roadmap').slice(1);
  doc.replaceChildren();
  let d = byId[id];
  if (!d) {
    const m = DATA.milestones.find(x => x.id === id);
    if (m) {
      d = { md: `# ${m.num}: ${m.name}\n\nNot started yet. This milestone covers: ${m.contents}\n\nIts write-up appears here when it's done.` };
    } else {
      d = byId.roadmap;
    }
  }
  if (id === 'roadmap' || !location.hash) {
    const h = document.createElement('h1'); h.textContent = 'Roadmap';
    const meta = document.createElement('p'); meta.className = 'meta';
    const done = DATA.milestones.filter(m => m.done).length;
    meta.textContent = `${done} of ${DATA.milestones.length} milestones done`;
    doc.append(h, meta, progressStrip());
    const body = document.createElement('div');
    body.innerHTML = marked.parse(d.md.replace(/^# .+\n/, ''));
    doc.append(body);
  } else {
    doc.innerHTML = marked.parse(d.md);
  }
  for (const t of doc.querySelectorAll('table')) {
    const w = document.createElement('div'); w.className = 'tablewrap';
    t.replaceWith(w); w.append(t);
  }
  for (const a of document.querySelectorAll('.navlink')) a.classList.toggle('current', a.dataset.id === id || (!location.hash && a.dataset.id === 'roadmap'));
  window.scrollTo(0, 0);
}
addEventListener('hashchange', render);
render();
</script>
