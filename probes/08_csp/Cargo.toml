[package]
name = "probe_csp"
version = "0.0.0"
edition.workspace = true
publish = false

[[bin]]
name = "probe_csp"
path = "out.rs"

[dependencies]
alx_rt = { path = "../rt" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
# Branded @handle sent into a spawned task: must fail to compile.
handle_send = []
# Spawned task borrows the enclosing scope's pool: must fail to compile.
scoped_spawn = []
