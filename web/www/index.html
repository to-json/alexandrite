<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alexandrite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<input type="checkbox" id="t" class="sr-only">

<div class="loading-overlay" id="loading" role="alert" aria-busy="true">
  <span class="loading-text">loading compiler<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>
</div>

<header>
  <h1>alexandr<span>ite</span></h1>
  <nav>
    <select class="examples" id="examples" aria-label="Examples"></select>
    <span class="status" id="status" role="status" aria-live="polite">loading</span>
    <button class="run stop" id="stopBtn" hidden>Stop</button>
    <button class="run" id="runBtn" disabled>
      Run<kbd>⌘⏎</kbd>
    </button>
    <input type="range" min="0" max="360" value="55" id="hue" class="hue" aria-label="Hue">
    <label for="t" class="toggle" aria-label="Toggle dark mode"></label>
  </nav>
</header>

<main>
  <section class="panel panel-editor" id="editorPanel" aria-label="Source editor">
    <h2 id="fileName">source</h2>
    <div class="editor-wrap" id="editorWrap">
      <div class="editor-container">
        <div class="line-numbers" id="lineNumbers" aria-hidden="true"></div>
        <div class="code-layers">
          <pre class="highlight-layer" id="highlightLayer" aria-hidden="true"></pre>
          <textarea
            class="editor-textarea"
            id="editor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            aria-label="Alexandrite source code"
          ></textarea>
        </div>
      </div>
    </div>
  </section>

  <div class="divider" id="divider" role="separator"></div>

  <section class="panel panel-output" id="outputPanel" aria-label="Program output">
    <h2>output</h2>
    <div class="output-wrap">
      <output class="output-content empty" id="output">press Run or ⌘⏎ to compile and run</output>
    </div>
  </section>
</main>

<script type="module" src="./main.js"></script>
</body>
</html>
